:root {
  --bg: #F5F7FB;
  --surface: #FFFFFF;
  --ink: #1B2333;
  --ink-soft: #3D4759;
  --muted: #6B7690;
  --border: #DDE2ED;
  --border-strong: #C7CEDC;
  --accent: #2453D6;
  --accent-ink: #FFFFFF;
  --accent-soft: #E8EDFC;
  --ok: #1C8F5E;
  --ok-soft: #E4F5EC;
  --warn: #B5790E;
  --warn-soft: #FBF0DC;
  --danger: #C43B4E;
  --danger-soft: #FCE8EA;
  --code-bg: #101728;
  --code-ink: #D9E1F2;
  --code-border: #232C42;
  --shadow: 0 1px 2px rgba(20,28,46,.07), 0 10px 28px rgba(20,28,46,.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0A1120;
    --surface: #121B2E;
    --ink: #E7EBF6;
    --ink-soft: #C2CAE0;
    --muted: #8B96B4;
    --border: #232D46;
    --border-strong: #303C5C;
    --accent: #7B9DFF;
    --accent-ink: #0A1120;
    --accent-soft: #1B2A4D;
    --ok: #4CC490;
    --ok-soft: #123726;
    --warn: #E3A63D;
    --warn-soft: #3A2C10;
    --danger: #F0899A;
    --danger-soft: #3A1620;
    --code-bg: #0A0F1D;
    --code-ink: #D9E1F2;
    --code-border: #1E2740;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"] {
  --bg: #0A1120;
  --surface: #121B2E;
  --ink: #E7EBF6;
  --ink-soft: #C2CAE0;
  --muted: #8B96B4;
  --border: #232D46;
  --border-strong: #303C5C;
  --accent: #7B9DFF;
  --accent-ink: #0A1120;
  --accent-soft: #1B2A4D;
  --ok: #4CC490;
  --ok-soft: #123726;
  --warn: #E3A63D;
  --warn-soft: #3A2C10;
  --danger: #F0899A;
  --danger-soft: #3A1620;
  --code-bg: #0A0F1D;
  --code-ink: #D9E1F2;
  --code-border: #1E2740;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.45);
}
:root[data-theme="light"] {
  --bg: #F5F7FB;
  --surface: #FFFFFF;
  --ink: #1B2333;
  --ink-soft: #3D4759;
  --muted: #6B7690;
  --border: #DDE2ED;
  --border-strong: #C7CEDC;
  --accent: #2453D6;
  --accent-ink: #FFFFFF;
  --accent-soft: #E8EDFC;
  --ok: #1C8F5E;
  --ok-soft: #E4F5EC;
  --warn: #B5790E;
  --warn-soft: #FBF0DC;
  --danger: #C43B4E;
  --danger-soft: #FCE8EA;
  --code-bg: #101728;
  --code-ink: #D9E1F2;
  --code-border: #232C42;
  --shadow: 0 1px 2px rgba(20,28,46,.07), 0 10px 28px rgba(20,28,46,.08);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "游ゴシック体", "Yu Gothic Medium", "Yu Gothic", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  font-size: 15px;
  line-height: 1.85;
  -webkit-font-smoothing: antialiased;
}
@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; animation: none !important; transition: none !important; }
}

.app {
  display: grid;
  grid-template-columns: 272px minmax(0, 1fr);
  min-height: 100vh;
}
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
}

.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  border-right: 1px solid var(--border);
  padding: 22px 16px 24px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.brand {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 2px 10px 14px;
  border-bottom: 1px solid var(--border);
}
.brand .mark {
  font-family: 'JBMono', ui-monospace, monospace;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: .08em;
  color: var(--accent);
}
.brand h1 {
  margin: 2px 0 0;
  font-size: 16.5px;
  font-weight: 700;
  color: var(--ink);
  text-wrap: balance;
}
.brand .sub {
  margin-top: 3px;
  font-size: 12px;
  color: var(--muted);
}

.navlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.nav-group-label {
  font-family: 'JBMono', ui-monospace, monospace;
  font-size: 10.5px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 14px 10px 4px;
}
.nav-group-label:first-child { padding-top: 2px; }
.navlist a {
  display: flex;
  align-items: baseline;
  gap: 9px;
  padding: 9px 10px;
  border-radius: 7px;
  color: var(--ink-soft);
  text-decoration: none;
  font-size: 13.4px;
  line-height: 1.4;
  border-left: 2px solid transparent;
}
.navlist a .tag {
  font-family: 'JBMono', ui-monospace, monospace;
  font-size: 10.5px;
  color: var(--muted);
  flex-shrink: 0;
  padding-top: 1px;
}
.navlist a:hover { background: var(--accent-soft); color: var(--ink); }
.navlist a.active { background: var(--accent-soft); color: var(--accent); border-left-color: var(--accent); font-weight: 700; }
.navlist a.active .tag { color: var(--accent); }

.sidebar-foot {
  margin-top: auto;
  padding-top: 14px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.theme-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  align-self: flex-start;
  background: transparent;
  border: 1px solid var(--border-strong);
  color: var(--ink-soft);
  border-radius: 7px;
  padding: 7px 11px;
  font-size: 12.5px;
  cursor: pointer;
  font-family: inherit;
}
.theme-btn:hover { border-color: var(--accent); color: var(--accent); }
.theme-btn:focus-visible, a:focus-visible, button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.gen-note { font-size: 11px; color: var(--muted); line-height: 1.6; }

.main { min-width: 0; padding: 40px clamp(20px, 4vw, 64px) 120px; }
.doc {
  max-width: 760px;
  margin: 0 auto 96px;
  scroll-margin-top: 24px;
}
.doc:first-child { margin-top: 4px; }
.doc-head {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-bottom: 20px;
  margin-bottom: 30px;
  border-bottom: 2px solid var(--border-strong);
}
.doc-head .eyebrow {
  font-family: 'JBMono', ui-monospace, monospace;
  font-size: 11px;
  letter-spacing: .10em;
  color: var(--accent);
  text-transform: uppercase;
}
.doc-head h2 { margin: 0; font-size: 25px; font-weight: 700; text-wrap: balance; }
.doc-meta { font-size: 12.5px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
.doc-meta code { background: none; padding: 0; }

.doc h3 { font-size: 18.5px; margin: 40px 0 12px; font-weight: 700; scroll-margin-top: 24px; }
.doc h4 { font-size: 15.5px; margin: 26px 0 8px; font-weight: 700; color: var(--ink-soft); scroll-margin-top: 24px; }
.doc h5 { font-size: 13.5px; margin: 20px 0 6px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; scroll-margin-top: 24px; }
.doc p { margin: 0 0 14px; max-width: 66ch; }
.doc ul, .doc ol { margin: 0 0 14px; padding-left: 1.4em; max-width: 66ch; }
.doc li { margin: 0 0 6px; }
.doc li > ul, .doc li > ol { margin-top: 6px; }
.doc strong { font-weight: 700; color: var(--ink); }
.doc hr { border: none; border-top: 1px solid var(--border); margin: 34px 0; }

.doc code {
  font-family: 'JBMono', ui-monospace, SFMono-Regular, monospace;
  font-size: .87em;
  background: var(--accent-soft);
  color: var(--accent);
  padding: .12em .4em;
  border-radius: 4px;
  word-break: break-word;
}
.doc pre {
  margin: 0 0 16px;
  background: var(--code-bg);
  border: 1px solid var(--code-border);
  border-radius: 10px;
  overflow-x: auto;
  box-shadow: var(--shadow);
}
.doc pre code {
  display: block;
  background: none;
  color: var(--code-ink);
  padding: 15px 18px;
  border-radius: 0;
  font-size: 12.8px;
  line-height: 1.7;
  white-space: pre;
  font-variant-numeric: tabular-nums;
}
.doc pre .lang {
  display: block;
  font-family: 'JBMono', ui-monospace, monospace;
  font-size: 10.5px;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 9px 18px 0;
  background: none;
}

.doc blockquote {
  margin: 0 0 16px;
  padding: 12px 16px;
  background: var(--warn-soft);
  border-left: 3px solid var(--warn);
  border-radius: 0 8px 8px 0;
  color: var(--ink-soft);
  max-width: 66ch;
}

最終更新: 2026-07-12
対応する詳細仕様書: `Sensor Edge/運用手順書_顧客追加フロー.md`（用語の意味や「なぜこうなっているか」はそちらを参照。本ページは「何をどう操作するか」だけに絞っている）
機器登録フォームの使い方: `Sensor Edge/実施手順_機器管理システム.md`

## これは何の作業か

新しい顧客が決まったら、顧客の拠点に置く小型の監視用機器（Sensor Edge、ラズパイ）を1台準備し、設定を入れて、発送するまでの一連の作業。

## 始める前に

この作業には性質の異なる2種類のSSHアクセスが登場する。混同しないよう先に整理しておく。

| 何にSSHするか | 使う鍵・方法 | 使う手順 |
|---|---|---|
| Sensor Edge本体（ラズパイ） | **atLIB共通の管理用SSH鍵ペア**。秘密鍵ファイルを自分の作業端末の`~/.ssh/`（Windowsは`$env:USERPROFILE\.ssh\`）にあらかじめコピーしておく（ファイルの入手先は担当エンジニアに確認） | 手順1・手順3・「うまくいかない場合」 |
| GCPの中継サーバー（`zabbix.atlib.jp`＝GCPインスタンス`zabbix-server`） | **gcloudコマンド**。自分のGoogleアカウントで`gcloud auth login`済みであれば、鍵の準備は不要（gcloudが自動で処理する） | 手順2・手順9・手順10 |

- 以下がそろっていること（無ければ担当エンジニアに確認）
  - 上記2種類のアクセスがどちらも準備できていること
  - Zabbix管理画面（`https://zabbix-admin.atlib.jp/`）にログインできるGoogleアカウント
  - 発送する新品のラズパイ本体（または使い回すSDカード）
- 用意するメモ帳（作業中に出てくる値を一時的に控えるため。作業完了後は破棄する）

---

## 手順1（任意）: 新品ラズパイに書き込む場合のみ

新品のラズパイを新たに用意する場合のみ実施する。既にセットアップ済みのSDカードを使い回す場合はこの手順は飛ばして手順2へ進む。

1. **操作**: Raspberry Pi Imager（アプリ）を起動する
2. **操作**: OSとして「Ubuntu Server 24.04 LTS (64-bit)」を選ぶ
3. **操作**: 書き込み先のSD/eMMCを選ぶ
4. **操作**: 歯車アイコン（詳細設定）を開き、以下を入力する
   - ホスト名: 台ごとに違う名前（例: `atl-proxy-01`）
   - ユーザー名・パスワード: 台ごとに違うランダムな文字列（同じものを使い回さない）
   - SSH: 「公開鍵認証のみを許可」を選び、**atLIB共通の管理用SSH公開鍵**を登録する（技術者ごとに別々の鍵を用意する必要はない。鍵ファイルの場所が分からない場合は担当エンジニアに確認）
   - Wi-Fi設定: 何も入力しない
5. **操作**: 書き込みを実行する
6. **操作**: 書き込み完了後、ホスト名・ユーザー名・生成したパスワードをメモ帳に控える（台帳への記録は手順8の機器登録フォームでまとめて行うため、ここでは一時メモでよい）
7. **操作**: SDカードを本体に挿し、Ethernetケーブルで社内LANに接続して起動する
8. **操作**: ラズパイのIPアドレスを確認する。ルーターの管理画面のDHCPクライアント一覧を開き、手順4で設定したホスト名（例: `atl-proxy-01`）を探す（ホスト名で見つからない場合、`ssh <ユーザー名>@<ホスト名>.local`のようにホスト名をそのまま使って接続できることもあるが、環境によっては使えないため、確実なのはルーターのDHCP一覧で調べる方法）
9. **画面/コマンド**: 見つかったIPアドレスに向けて、以下のようにSSH接続する（`<atLIB共通の秘密鍵のパス>`は自分の端末にコピーした鍵ファイルのパス、`<ユーザー名>`と`<ラズパイのIPアドレス>`は手順4・上記で確認した値に置き換える）
   ```bash
   ssh -i "<atLIB共通の秘密鍵のパス>" <ユーザー名>@<ラズパイのIPアドレス>
   ```
10. **確認**: パスワードを聞かれずにログインできること
11. **確認**: 一度ログアウトし、あえて秘密鍵を指定せずに同じ接続を試みる。パスワードでのログインが拒否されること（鍵がないと入れない状態になっていること）

---

## 手順2: GCPの中継サーバーで顧客用の受け口を作る

1. **画面/コマンド**: 作業端末で以下を実行し、`zabbix.atlib.jp`（GCPインスタンス`zabbix-server`）にSSH接続する（自分のGoogleアカウントで`gcloud auth login`済みであれば、鍵の指定は不要）
   ```bash
   gcloud compute ssh zabbix-server --zone=asia-northeast1-a
   ```
2. **操作**: 以下をコピーして貼り付け、`<顧客ID>`の部分だけ実際の顧客ID（例: `customerB`）に書き換えてから実行する
   ```bash
   sudo /etc/chisel/add_customer.sh <顧客ID>
   ```
3. **確認**: 実行結果に `port` ・ `username` ・ `password` の3つの値が表示される。**この3つを必ずメモ帳に控える**（手順3で使う）
4. **操作**: 続けて以下を実行し、設定を反映させる
   ```bash
   sudo systemctl restart chisel-server
   ```
5. **注意**: この再起動で、既存の他のお客様が一瞬（約1秒）切断→自動で再接続する。深夜など影響が少ない時間帯に行うのが望ましい

---

## 手順3: ラズパイ本体に設定を入れる

1. **操作**: `20260702_SenseEdge構築時投入config.txt` というファイルを開く
2. **操作**: ファイル冒頭の5つの変数を書き換える

   | 変数名 | 何を入れるか |
   |---|---|
   | `NEW_HOSTNAME` | この顧客用のプロキシ名（自分で決める。例: `atlib-proxy-02`） |
   | `NEW_PSK_ID` | この顧客用の識別子（自分で決める。例: `PSK-CUSTOMER-02`） |
   | `CHISEL_PORT` | 手順2でメモした`port` |
   | `CHISEL_USER` | 手順2でメモした`username` |
   | `CHISEL_PASS` | 手順2でメモした`password` |

3. **画面/コマンド**: 対象のラズパイに、手順1の手順9と同じ方法でSSH接続する（IPアドレスが分からない場合は手順1の手順8を参照。既にセットアップ済みのSDカードを使い回している場合も、IPアドレスの調べ方・接続方法は同じ）
   ```bash
   ssh -i "<atLIB共通の秘密鍵のパス>" <ユーザー名>@<ラズパイのIPアドレス>
   ```
4. **操作**: 書き換えたファイルの中身を、上記で接続したターミナルに、**上から順番に、以下の6つのブロックに分けて**貼り付けて実行する。**一気に全部貼り付けない**（自分自身の接続が切れてしまうことがあるため）
   1. ブロック1（ファイル内 A・B・B2の部分）を貼り付けて実行する
      - **確認**: 今のSSH接続はそのまま閉じずに、**別のウィンドウをもう1つ開いて**、鍵でログインできることを確認してから次に進む（万一失敗した場合に元の接続が生きているようにするため）
   2. ブロック2（B3・B4・B5・B6・B8の部分）を貼り付けて実行する（ここではまだ何も切断されない）
   3. `sudo rpi-eeprom-config --edit` を実行する。エディタが開くので、`BOOT_ORDER`の値を内蔵ストレージのみを使う設定に変更して保存する
   4. ブロック3（C〜Iの部分）を貼り付けて実行する
   5. **操作**: `ip -brief link` を実行し、**確認**: `eth0`（有線LAN）が`UP`になっていて、IPアドレスが振られていることを確認する。これを確認できたら `sudo reboot` を実行する（Wi-Fiは再起動と同時に使えなくなるため、必ず有線LANを先につないでおくこと）
   6. 再起動後、有線LAN経由・鍵認証で再度SSHログインできることを確認する
5. **確認**: 最後に画面に表示される **Hostname** ・ **PSK Identity** ・ **PSK Key** の3つを必ずメモ帳に控える（手順5で使う）
6. **確認**: 「Connected」というログが表示されること

---

## 手順4（スキップ）: ディスク暗号化

この手順はまだ実装されていない（将来対応）。今は何もしなくてよい。

---

## 手順5: Zabbix管理画面にプロキシとして登録する

1. **画面**: `https://zabbix-admin.atlib.jp/` を開き、Googleアカウントでログインする
2. **操作**: 左メニューの **Administration（管理） > Proxies（プロキシ）** を開き、右上の **Create proxy** をクリックする
3. **操作**: 「Proxy」タブに以下を入力する
   - **Proxy name**: 手順3でメモした `NEW_HOSTNAME` の値と**完全に同じ文字列**を入力する
   - **Proxy mode**: **Active** を選ぶ（Passiveは選ばない）
   - **Proxy group**: 何も選ばず空欄のままでよい
4. **操作**: 「Encryption」タブに切り替え、以下を入力する
   - **Connections to proxy**: `PSK` にチェックを入れる（`No encryption`のチェックは外す）
   - **PSK identity**: 手順3でメモした `PSK Identity` の値
   - **PSK value**: 手順3でメモした `PSK Key` の値（64文字の英数字）
5. **操作**: 画面下の **Add** をクリックして保存する
6. **確認**: 保存後、一覧画面で該当プロキシのステータスが数分以内に **「Available」**（緑色）に変わることを確認する
7. **うまくいかない場合**: 「Unknown」のまま変わらない場合は、本ページの「うまくいかない場合」セクション、または詳細仕様書の手順9を参照する

---

## 手順6: 技術者用の遠隔操作ファイルを作る

1. **操作**: `InfraVision_Launcher_Template.bat` をコピーして新しいファイルを作る
2. **操作**: ファイル冒頭の3行を書き換える
   ```bat
   SET CUSTOMER_ID=<顧客ID>
   SET CHISEL_PORT=<手順2でメモしたport>
   SET TARGET_URL=<顧客サイトの管理対象機器のURL>
   ```
3. **確認**: このbatファイルをダブルクリックすると、Chrome経由で顧客サイトの機器にリモートアクセスできることを確認する

---

## 手順7: 発送前の最終確認（チェックリスト）

発送前に、以下がすべて満たされているか確認する。

- [ ] パスワードでのログインが拒否される（鍵認証のみになっている）
- [ ] `ip -brief link` を実行し、`wlan0`（Wi-Fi）が存在しない、または止まったままであることを確認した
- [ ] シリアルコンソール・HDMI出力が無効化されている（手順3のブロックで実施済みのはず）
- [ ] 封印シールを貼る準備ができている（手順8で実施）

---

## 手順8: 封印・記録・発送

1. **操作**: 本体のネジ・SDカードスロット周辺に、通し番号付きの改ざん検知シール（分解すると跡が残るタイプ）を貼る
2. **画面**: 「Sensor Edge機器登録フォーム」を開く（リンクは`Sensor Edge/実施手順_機器管理システム.md`を参照）
3. **操作**: デバイスのシリアル番号・封印シールの番号・ホスト名・OSユーザー名・SSH公開鍵識別子・顧客ID・顧客名・発送日を入力して送信する（手順1でメモした値がここで必要になる）
4. **確認**: 管理用スプレッドシートの「機器台帳」タブに、入力した内容の行が追加されていることを確認する
5. **操作**: ラズパイ本体を顧客先へ発送する

---

## 手順9: 顧客が設置した後の疎通確認

顧客がラズパイを設置・起動したら、**GCPの中継サーバー側から**（顧客の機器へ直接は入れないため）確認する。

1. **画面/コマンド**: 手順2と同じ方法で`zabbix.atlib.jp`にSSH接続する
   ```bash
   gcloud compute ssh zabbix-server --zone=asia-northeast1-a
   ```
2. **操作**: 以下を実行する（`<username>`は手順2でメモした値に置き換える）
   ```bash
   sudo journalctl -u chisel-server --since "10 min ago" | grep <username>
   ```
   **確認**: それらしいログが出ていること
3. **操作**: 以下を実行する（`<CHISEL_PORT>`は手順2でメモした値に置き換える）
   ```bash
   sudo ss -tlnp | grep :<CHISEL_PORT>
   ```
   **確認**: 何か表示されること（ポートが実際に使われている）
4. **画面**: Zabbix管理画面の **Administration > Proxies** で、該当プロキシが **「Available」** になっていることを確認する
5. **操作**: 手順6で作った起動batファイルを実際にダブルクリックし、ブラウザで顧客先の機器の管理画面が表示されることを確認する
6. これが確認できたら作業完了

---

## 手順10: 契約終了・機器返却・改ざん疑い時の対応

以下のいずれかが発生したら、速やかに実施する。

- 契約終了・機器返却
- 封印シールの破損・改ざんを見つけた
- 不正な持ち出し・転用の疑いがある

**操作**:
1. 手順2と同じ方法（`gcloud compute ssh zabbix-server --zone=asia-northeast1-a`）で`zabbix.atlib.jp`にSSH接続し、`customer_ledger.csv`の該当顧客の`username`/`password`を無効化する
2. `/etc/chisel/users.json`から該当エントリを削除し、`sudo systemctl restart chisel-server`を実行する
3. Zabbix管理画面で該当プロキシを削除するか、PSKを再生成する（PSKローテーションの手順は`msp-frontend-server/実施手順_ZabbixProxy_PSKローテーション.md`を参照）

この作業は顧客ごとに個別の認証情報になっているため、他のお客様には影響しない。

---

## うまくいかない場合

### 顧客先のブラウザ・SSHアクセスがタイムアウトする

顧客先に発送済みの機器は、手順1・3で使った「同じLAN内から直接SSH」はできない（顧客のネットワーク内にあるため）。代わりに、Sensor Edge自身が動かす中継機能（tinyproxy）経由で自分自身に折り返す形で接続する必要がある。接続方法は`msp-frontend-server/実施手順_ZabbixProxy_PSKローテーション.md`の「始める前に」に手順があるので、そちらに従って接続し、以下を実行して復旧を試みる。
```bash
sudo systemctl restart tinyproxy
```
それでも直らない場合は担当エンジニアに連絡する。

### 新規顧客が繋がらない

- 手順2で `systemctl restart chisel-server` を忘れていないか確認する
- ラズパイに入力した `CHISEL_USER`/`CHISEL_PASS` が手順2でメモした値と一致しているか確認する（手打ちミスが多い）
- それでも分からない場合は担当エンジニアに連絡する

### プロキシのステータスが「Unknown」「Unavailable」のまま変わらない

- 手順5で入力したProxy nameが手順3の`NEW_HOSTNAME`と1文字も違わず一致しているか確認する
- PSK identity / PSK valueの入力ミスがないか確認する
- それでも分からない場合は担当エンジニアに連絡する

## これは何の作業か

申込みが確定した顧客を、実際に監視サービスが使える状態にするまでの一連の作業。Sensor Edge（拠点設置の機器）の設置と、顧客ポータル（Webサイト）への登録の両方を行う。

## 始める前に

以下がヒアリング（Web会議）で確定していること。無ければ担当者に確認してから始める。

| 項目 | 例 |
|---|---|
| `customer_code`（英数字ID） | `atlib002` |
| `company_name`（正式名称） | `atLIB株式会社様` |
| 連絡先メールアドレス | |
| プラン名 | `エントリープラン` |
| 顧客のネットワークのIPレンジ | `192.168.1.1-254` |
| SNMP監視対象機器のおおよその台数 | 50台が目安の上限。超えそうな場合は担当エンジニアに相談 |

また、`msp-frontend-server`にSSH接続できる環境が必要（手順3で使用）。

---

## 手順1: Sensor Edgeの設置（全顧客で必ず実施）

この手順は省略できない。**必ず** `Sensor Edge/実施手順_顧客追加フロー.md` の手順1〜9をそのまま実施する。

**完了条件（次の手順に進む前に必ず確認する）**:
- Zabbix管理画面で該当プロキシが「Available」表示になっている
- 発行された **`proxyid`**（Zabbix Proxy ID）を控えている（手順2で使う）

> **重要な順序**: この手順1を完了させてから、次の手順2（オンボーディングスクリプト）を実行すること。**逆の順番で実行すると、後から直すのに手作業のデータベース修正が必要になる**ため、順番を守ること。

---

## 手順2: ポータルへの顧客登録

1. **画面/コマンド**: `msp-customer-portal`のプロジェクトがある端末で、ターミナルを開く
2. **操作**: 以下をコピーし、`< >`で囲まれた部分をすべて実際の値に書き換えてから実行する
   ```bash
   npm run onboard -- \
     --code <customer_code> \
     --name "<company_name>" \
     --email <連絡先メールアドレス> \
     --plan "<プラン名>" \
     --proxy-id <手順1で控えたproxyid> \
     --ip-range <顧客のネットワークのIPレンジ、例: 192.168.1.1-254>
   ```
3. **確認**: エラーなく完了すること。`customer_code`が既に使われている場合はエラーで止まる（別のコードを使う）
4. **確認**: 完了時にコンソールに次の手順3でそのまま使うコマンドが表示されるので、そのままコピーしておく
5. **画面**: Sensor Edge機器管理システムの管理用スプレッドシートを開く（リンクは`Sensor Edge/実施手順_機器管理システム.md`を参照）
6. **操作**: 「顧客マスタ」タブに、`customer_code`と`company_name`を1行追加する（これを忘れると、後でSensor Edge機器を登録するときにこの顧客がプルダウンに出てこない）

---

## 手順3: 機器の自動検出を設定する

1. **画面/コマンド**: 以下を実行し、`msp-frontend-server`にSSH接続する
   ```bash
   gcloud compute ssh msp-frontend-server --zone=asia-northeast1-a --tunnel-through-iap
   ```
2. **操作**: 接続後、以下を実行する
   ```bash
   cd /opt/atlib-msp-dev/zabbixserver/batch
   ```
3. **操作**: まず内容確認のため、手順2で表示されたコマンドの`--dry-run`版を実行する
   ```bash
   python setup_discovery.py --dry-run --customer-code <code> --company-name "<name>"
   ```
4. **確認**: 3つのアクションが「作成済み」と表示されること
5. **操作**: 問題なければ、手順2の出力にあった`--apply`のコマンドをそのまま貼り付けて実行する
6. **注意**: この手順はCloud Run（本番アプリ本体）からは実行できない。必ず`msp-frontend-server`にSSHした状態で実行すること

---

## 手順4: 顧客への引き渡し

- **操作**: 歓迎メール（手順2で自動送信済み）が実際に顧客に届いているか確認する
- **操作**: 顧客に以下を案内する
  - ログインURL: ポータルの `/login.html`
  - パスワードを忘れた場合: `/reset-password.html` から再設定できる
  - 「未知機器の検出」通知トグル（通知設定ページ、デフォルト無効）について案内する
  - 「トポロジー」画面（`/topology.html`）を案内する。機器の役割（ルーター/スイッチ/AP/プリンター等）や、上位接続先・ケーブル種別を顧客自身で設定できること、月次報告書にも同じ内容が反映されることを伝える

---

## 手順5: 監視が始まっていることの確認

1. **画面**: ポータルの「機器管理」画面を開く
2. **確認**: 手順3で設定した機器が自動的に一覧表示されていること
3. 不要な機器がある場合、顧客はポータルから無効化・削除できる
4. **注意（顧客への案内事項）**: 機器を「削除」しても、その機器が引き続き稼働していると次回の自動検出で再登録されることがある。恒久的に監視を止めたい場合は「削除」ではなく「無効化」を使うよう顧客に案内する

---

## 手順11: 契約終了時の後処理

Sensor Edge側（機器回収・認証情報の失効）は `Sensor Edge/実施手順_顧客追加フロー.md` の手順10を参照。ここでは**ポータル側**の後処理のみ扱う。

### 11-1. ポータルへのログインを止める

**注意**: これは顧客の実データを直接書き換える操作。実施前に必ず関係者の承認を得ること。

1. **画面/コマンド**: Cloud SQL Auth Proxy経由で`msp-customer-portal-db`に接続する（接続方法が分からない場合は担当エンジニアに確認）
2. **操作**: 以下のSQLを実行する（`<対象customer_code>`を実際の値に書き換える）
   ```sql
   UPDATE customers SET status = 'suspended', updated_at = now() WHERE customer_code = '<対象customer_code>';
   ```
3. **確認**: この更新だけで、顧客は即座にログイン・API利用ができなくなる（アプリ側の変更は不要）

### 11-2. Zabbix側は「削除」ではなく「無効化」から始める

1. **画面**: Zabbix管理画面で、該当顧客のホストグループに属する全ホストを**無効化**する（削除はしない）
2. **操作**: 通知用Zabbixユーザー（`notify_{customer_code}`）・顧客専用アクションも同様に無効化する
3. 保持期間（目安1〜3ヶ月、契約内容による）が経過し、問題なければホストグループごと削除する（削除は担当エンジニアと相談の上で実施）

### 11-3. データの保持

ポータルDBのレコードは`suspended`のまま一定期間保持し、その後の削除要否は担当エンジニアに確認する。

---

## うまくいかない場合

### `npm run onboard` の後、顧客がログインできない

- 歓迎メールが迷惑メールフォルダに入っていないか、顧客に確認してもらう
- それでも解決しない場合は担当エンジニアに連絡する

### 機器管理画面に自動登録された機器が表示されない

- 手順3を実行し忘れていないか確認する
- 入力した`--ip-range`が顧客の実際のネットワークと合っているか確認する
- 解決しない場合は担当エンジニアに連絡する

### 手順1より先に手順2を実行してしまった

- 自分では直せない。すぐに担当エンジニアに連絡する（手作業でのデータベース修正が必要）
</script>

## これは何の作業か

コードの変更を、実際に動いているサーバー（`msp-frontend-server`）に反映させる作業。ほとんどの場合は「手順1」だけで終わる。

## 始める前に

- `msp-frontend-server`にSSH接続できる環境（`gcloud`コマンドが使える端末）が必要
- コードの変更は事前にGitHub（`atlib-msp-dev`リポジトリ）にpush済みであること

---

## 手順1: 通常のデプロイ（2回目以降・ほとんどの場合はこれだけ）

1. **画面/コマンド**: 作業端末で以下をそのまま実行する
   ```bash
   gcloud compute ssh msp-frontend-server --zone=asia-northeast1-a --tunnel-through-iap --command="cd /opt/atlib-msp-dev && git pull"
   ```
2. **確認**: エラーなく完了すること。コピー作業やサービス再起動は不要（自動で反映される仕組みになっている）
3. **操作（任意・反映確認したい場合）**: 以下を実行する
   ```bash
   curl -sk https://localhost/atlib_monthly_report.html -H 'Host: topology.zabbix.atlib.jp' -o /dev/null -w 'HTTP %{http_code}\n'
   ```
4. **確認**: `HTTP 200`と表示されれば反映成功

---

## 手順2（担当エンジニアのみ）: 初回セットアップ

サーバーを新しく立て直す場合のみ必要な作業。日常的には発生しない。実施する場合は担当エンジニアが行う。詳細は詳細仕様書の手順2を参照。

---

## 手順3（担当エンジニアのみ）: 日次バッチの動作確認

日次バッチ（毎日AM2:00頃に自動実行）が正しく動いているか確認したいときだけ使う。

1. **画面/コマンド**: `msp-frontend-server`にSSH接続する
2. **操作**: 以下を実行し、次回実行予定時刻を確認する
   ```bash
   systemctl list-timers msp-security-batch.timer
   ```
3. **操作（今すぐ試したい場合）**: 以下を実行する
   ```bash
   sudo systemctl start msp-security-batch.service
   ```
4. **操作**: 実行結果のログを確認する
   ```bash
   journalctl -u msp-security-batch.service -n 50 --no-pager
   ```
5. **注意**: `zabbixserver/deploy/`配下のファイルを変更してデプロイした場合は、必ず以下を実行してから上記を試す
   ```bash
   sudo systemctl daemon-reload
   ```

---

## 手順4・5（担当エンジニアのみ）: Zabbix側の設定変更・nginx設定変更

ディスカバリイベントの保持期間設定やnginxのリダイレクト設定は、通常のデプロイでは触らない部分。変更が必要な場合は担当エンジニアが対応する。詳細仕様書の手順4・5を参照。

---

## 手順6（担当エンジニアのみ）: 運用手順書ページ（このページ自体）の更新

このガイド自体を含む運用手順書ページ（`https://topology.zabbix.atlib.jp/runbooks.html`）を更新する手順。手順書のMarkdownファイルを直したあと、Windows端末でビルドし直してデプロイする必要がある。日常的な作業ではないため、担当エンジニアが行う。詳細は詳細仕様書の手順6を参照。

---

## 定期的に見ておくとよいこと（トラブルの早期発見用）

- **画面/コマンド**: 以下を実行し、サイトが正常に見えているか確認できる
  ```bash
  gcloud compute backend-services get-health msp-frontend-bes --global
  ```
- **確認**: バックエンドの状態が「HEALTHY」になっていること。これが「UNHEALTHY」になっている場合、サイトが表示されなくなっている可能性があるため、担当エンジニアに連絡する

---

## うまくいかない場合

### `git pull`が認証エラーになる

自分では直せない。担当エンジニアに連絡する（サーバー側の鍵の再設定が必要な可能性がある）。

### サイト（`https://topology.zabbix.atlib.jp/`）が表示されない・エラーページになる

- まず「定期的に見ておくとよいこと」の`get-health`コマンドを実行し、UNHEALTHYになっていないか確認する
- 自分で判断がつかない場合は、状況（いつから・どんなエラーか）をメモした上ですぐに担当エンジニアに連絡する

<script type="text/plain" id="src-guide-pw-admin">
最終更新: 2026-07-12
対応する詳細仕様書: `msp-frontend-server/運用手順書_Zabbix管理者パスワードローテーション.md`

## これは何の作業か

月次レポートツールが使う共通アカウント（`atladmin`）のパスワードを、定期的に新しいものに変更する作業。

## いつやるか

3〜6ヶ月に1回、または担当者の異動・退職時、パスワード漏洩の疑いがある場合はすぐに実施する。

## 始める前に

- `atladmin`以外のZabbix管理者アカウントでログインできること（自分自身のパスワードを変える形にはできないため）
- GCP（`msp-zabbix`プロジェクト）のSecret Managerに書き込める権限のアカウントでログインできること
- `msp-frontend-server`にSSH接続できる端末

---

## 手順1: 新しいパスワードを作る

1. **画面/コマンド**: PowerShellを開き、以下をそのまま実行する
   ```powershell
   -join ((48..57)+(65..90)+(97..122) | Get-Random -Count 24 | ForEach-Object {[char]$_})
   ```
2. **確認**: ランダムな24文字の文字列が表示される
3. **操作**: この値を一時的にメモ帳に控える（作業完了後は必ず破棄する。Slack等の残る場所には貼らない）

---

## 手順2: Zabbix側でパスワードを変更する

1. **画面**: `https://zabbix-admin.atlib.jp/`（Googleログイン）にアクセスし、`atladmin`**以外**の管理者アカウントでログインする
2. **操作**: 左メニューの **Administration（管理） > Users（ユーザー）> Users** を開く
3. **操作**: 一覧から `atladmin` をクリックする
4. **操作**: 「Change password」から、手順1で作った新しいパスワードを入力して保存する

---

## 手順3: Secret Managerの値を更新する

作業端末（gcloud認証済み）で行う。

1. **画面/コマンド**: PowerShellで以下を実行し、書き込み権限のあるアカウントでログインし直す
   ```powershell
   gcloud.cmd auth login
   ```
   **注意**: ここで「Googleアカウントのパスワードを入力してください」という画面が出たら、それは通常のWindowsパスワードではない。何度入力してもうまくいかない場合は`Ctrl+C`で中断し、上記コマンドをもう一度実行してブラウザ経由でログインし直すこと
2. **操作**: 以下を1行ずつ実行する（`ここに手順1で生成した新パスワード`の部分を実際の値に置き換える）
   ```powershell
   $passBytes = [Text.Encoding]::UTF8.GetBytes("ここに手順1で生成した新パスワード")
   [IO.File]::WriteAllBytes("$env:TEMP\zabbix_pass_new.txt", $passBytes)
   gcloud.cmd secrets versions add zabbix-api-password --data-file="$env:TEMP\zabbix_pass_new.txt" --project=msp-zabbix
   Remove-Item "$env:TEMP\zabbix_pass_new.txt" -Force
   ```
3. **確認**: エラーなく完了すること
4. **注意**: 上記のコマンドは**必ずそのままコピーして使う**こと。他の方法（`Out-File`など）で書き出すと、見えない文字が混入してログイン失敗の原因になることが過去に実際に起きている

---

## 手順4: 古いセッションをクリアする

1. **画面/コマンド**: 以下をそのまま実行する（`<msp-frontend-serverの外部IP>`は担当エンジニアに確認するか、`gcloud compute instances describe zabbix-server --zone=asia-northeast1-a --format="value(networkInterfaces[0].accessConfigs[0].natIP)"`で調べる）
   ```powershell
   ssh -i "$env:USERPROFILE\.ssh\google_compute_engine" yoshihisa_hagisaka@<msp-frontend-serverの外部IP> "sudo rm -f /tmp/atlib_zbx_token.cache"
   ```

---

## 手順5: 動作確認

1. **画面**: ブラウザで `https://topology.zabbix.atlib.jp/atlib_monthly_report.html` を開く
2. **確認**: 「顧客選択」ドロップダウンにホストグループの一覧が表示されること
3. **うまくいかない場合**: 本ページの「うまくいかない場合」を参照

---

## 手順6: 後片付け

- **操作**: メモした新パスワードを破棄する

---

## うまくいかない場合

### 「Not authorized」「Incorrect user name or password」エラーになる

- 手順3のコマンドをそのままコピーして使ったか確認する（別の方法で書き出すと文字化けの原因になる）
- 手順2でZabbix側のパスワード変更が実際に保存されているか、Zabbix管理画面で再確認する
- 解決しない場合は担当エンジニアに連絡する

### 前の状態に戻したい（ロールバック）

自分で判断せず、担当エンジニアに連絡する。Secret Manager側とZabbix側の両方を正しい組み合わせに戻す必要があり、片方だけ戻すと不整合が起きる。
</script>
<script type="text/plain" id="src-guide-pw-db">
最終更新: 2026-07-12
対応する詳細仕様書: `msp-frontend-server/運用手順書_zabbix-server_DBパスワードローテーション.md`

## ⚠️ 先に読むこと

この作業を間違えると**全顧客の監視が停止する**。手順6（起動確認）で問題が見つかった場合は、自己判断で先に進めず、必ず担当エンジニアに連絡すること。初めて実施する場合は、担当エンジニアと一緒に（画面を見せながら）行うことを推奨する。業務影響が少ない時間帯（夜間など）に実施すること。

## これは何の作業か

Zabbix本体が使うデータベース（PostgreSQL）のパスワードを、新しいものに変更する作業。

## 始める前に

- `zabbix-server`にSSH接続できる端末・鍵
- 作業前に「今の時刻」をメモしておく（何かあったときに、バックアップファイルのタイムスタンプを特定するため）

---

## 手順1: サーバーにSSH接続する

1. **画面/コマンド**: PowerShellで以下を実行する
   ```powershell
   ssh -i "$env:USERPROFILE\.ssh\google_compute_engine" yoshihisa_hagisaka@34.85.69.73
   ```
2. **うまくいかない場合**: IPアドレスが変わっている可能性がある。以下で最新のIPを調べてから同じコマンドを試す
   ```powershell
   gcloud compute instances describe zabbix-server --zone=asia-northeast1-a --format="value(networkInterfaces[0].accessConfigs[0].natIP)"
   ```

---

## 手順2: 新しいパスワードを作る

1. **画面/コマンド**: 接続したサーバー上で以下を実行する
   ```bash
   NEWPASS=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 32)
   echo "生成完了（長さ: ${#NEWPASS}）"
   ```
2. **確認**: 「生成完了（長さ: 32）」のように表示される
3. **注意**: `echo $NEWPASS` のようにパスワードそのものを画面に表示しないこと（長さの確認だけに留める）

---

## 手順3: 今の設定をバックアップする

1. **画面/コマンド**: 以下をそのまま実行する
   ```bash
   sudo mkdir -p /root/backups
   sudo cp /etc/zabbix/zabbix_server.conf /root/backups/zabbix_server.conf.bak_$(date +%Y%m%d_%H%M%S)
   sudo cp /etc/zabbix/web/zabbix.conf.php /root/backups/zabbix.conf.php.bak_$(date +%Y%m%d_%H%M%S)
   ```
2. **確認**: エラーが出ずに完了すること（このバックアップが手順8のロールバックで使われる）

---

## 手順4: データベース側のパスワードを変更する

1. **画面/コマンド**: 以下をそのまま実行する
   ```bash
   sudo -u postgres psql -c "ALTER USER zabbix WITH PASSWORD '${NEWPASS}';"
   ```
2. **確認**: `ALTER ROLE`と表示されること

---

## 手順5: 設定ファイルを新しいパスワードに書き換える

1. **画面/コマンド**: 以下をそのまま実行する
   ```bash
   sudo sed -i "s/^DBPassword=.*/DBPassword=${NEWPASS}/" /etc/zabbix/zabbix_server.conf
   sudo sed -i "s|\\\$DB\['PASSWORD'\].*=.*|\$DB['PASSWORD']\t\t\t= '${NEWPASS}';|" /etc/zabbix/web/zabbix.conf.php
   ```
2. **確認**: 以下を実行し、両方とも `1` と表示されること（パスワードの値そのものは表示しない）
   ```bash
   sudo grep -c "^DBPassword=" /etc/zabbix/zabbix_server.conf
   sudo grep -c "DB\['PASSWORD'\]" /etc/zabbix/web/zabbix.conf.php
   ```

---

## 手順6: サーバーを再起動して接続確認する（最重要）

1. **画面/コマンド**: 以下をそのまま実行する
   ```bash
   sudo systemctl restart zabbix-server
   sleep 3
   sudo systemctl status zabbix-server --no-pager | head -10
   sudo tail -20 /var/log/zabbix/zabbix_server.log
   ```
2. **確認**: `Zabbix Server ... started` のようなログが出ていて、`database is down` のようなエラーが**出ていない**こと
3. **問題があった場合**: 自己判断せず、すぐに担当エンジニアに連絡し、手順8（ロールバック）を一緒に実施する

---

## 手順7: Web画面の動作確認

1. **画面/コマンド**: 以下をそのまま実行する
   ```bash
   sudo systemctl reload php8.3-fpm
   ```
2. **画面**: ブラウザで `https://zabbix-admin.atlib.jp/` を開く
3. **確認**: ログイン画面が正常に表示され、実際にログインできること

---

## 手順8（問題発生時のみ）: ロールバック

**この手順は担当エンジニアと一緒に行うこと。**

```bash
sudo cp /root/backups/zabbix_server.conf.bak_<タイムスタンプ> /etc/zabbix/zabbix_server.conf
sudo cp /root/backups/zabbix.conf.php.bak_<タイムスタンプ> /etc/zabbix/web/zabbix.conf.php
sudo -u postgres psql -c "ALTER USER zabbix WITH PASSWORD '<旧パスワード>';"
sudo systemctl restart zabbix-server
sudo systemctl reload php8.3-fpm
```

`<タイムスタンプ>`は手順3でバックアップした際のファイル名から特定する。`<旧パスワード>`が分からない場合は担当エンジニアに確認する。

---

## 手順9: 後片付け

- **操作**: ターミナルの入力履歴に新パスワードが残っている場合は消す
  ```bash
  history -c
  ```

---

## うまくいかない場合

すべて自己判断せず、担当エンジニアに連絡すること。特に手順6でエラーが出た場合は、監視全体が止まっている可能性があるため最優先で連絡する。
</script>
<script type="text/plain" id="src-guide-psk-proxy">
最終更新: 2026-07-12
対応する詳細仕様書: `msp-frontend-server/運用手順書_ZabbixProxy_PSKローテーション.md`

## これは何の作業か

顧客拠点のSensor Edge機器が使っている認証用の鍵（PSK）を、新しいものに交換する作業。

## いつやるか

3〜6ヶ月に1回、または以下のいずれかが起きたとき。

- 封印シールの破損・改ざんを見つけた
- 契約終了・機器返却時（この場合はローテーションではなく「失効」。`Sensor Edge/実施手順_顧客追加フロー.md`の手順10を参照）
- 不正な持ち出し・転用の疑いがある

## 始める前に

**重要**: この作業には、Sensor Edge本体にログインする必要がある。Sensor Edgeは顧客先のネットワーク内にあり直接SSHできないため、少し特殊な接続方法（下記）を使う。**対象機器の現在のLAN IPアドレスが台帳に記録されていない場合、この接続方法自体が使えない**。その場合は自己判断で進めず、担当エンジニアに相談すること（顧客にルーターのDHCP一覧確認を依頼する等の対応が必要になる）。

- Zabbix管理画面（`https://zabbix-admin.atlib.jp/`）にログインできること
- PuTTY等のSSHクライアント
- 対象Sensor EdgeのLAN IPアドレス（台帳を確認、無ければ担当エンジニアに相談）
- 対象顧客のCHISEL_PORT（顧客追加時の台帳を確認）

**Sensor Edgeへの接続方法**:
1. PuTTYの「Session」で Host=`<Sensor EdgeのLAN IP>`、Port=`22` を設定
2. 「Connection > Proxy」で Proxy type=`HTTP`、hostname=`zabbix.atlib.jp`、Port=`<当該顧客のCHISEL_PORT>` を設定
3. 接続する

---

## 手順1: 新しいPSKを作る

**Sensor Edge上で**（上記の接続方法でログイン後に）実行する。

1. **画面/コマンド**: 以下をそのまま実行する
   ```bash
   sudo sh -c "openssl rand -hex 32 > /etc/zabbix/zabbix_proxy.psk.new"
   sudo chown zabbix:zabbix /etc/zabbix/zabbix_proxy.psk.new
   sudo chmod 600 /etc/zabbix/zabbix_proxy.psk.new
   echo "生成完了（内容は表示しない）"
   ```
2. **操作**: 以下を実行し、生成された値を一度だけ画面に表示してメモする
   ```bash
   sudo cat /etc/zabbix/zabbix_proxy.psk.new
   ```
3. **注意**: メモした値は作業完了後に画面・コマンド履歴から消すこと

---

## 手順2: Zabbix管理画面側を更新する

1. **画面**: `https://zabbix-admin.atlib.jp/` にログインする
2. **操作**: **Administration（管理） > Proxies（プロキシ）** を開き、対象のProxy名（例: `atlib-proxy-01`）をクリックする
3. **操作**: **Encryption**タブを開く
4. **操作**: **PSK value**を、手順1でメモした新しい値に書き換える。**PSK identityは変更しない**（valueだけを変える）
5. **操作**: **Update**をクリックして保存する
6. **注意**: 保存した瞬間から、このProxyは一時的に「Unavailable」表示になる（手順3を終えるまでの想定内の状態）

---

## 手順3: Sensor Edge側に反映する

**Sensor Edge上で**実行する。

1. **画面/コマンド**: 以下をそのまま実行する
   ```bash
   sudo mv /etc/zabbix/zabbix_proxy.psk.new /etc/zabbix/zabbix_proxy.psk
   sudo chown zabbix:zabbix /etc/zabbix/zabbix_proxy.psk
   sudo chmod 600 /etc/zabbix/zabbix_proxy.psk
   sudo systemctl restart zabbix-proxy
   sleep 3
   sudo systemctl status zabbix-proxy --no-pager | head -10
   ```
2. **確認**: エラーなく再起動していること

---

## 手順4: 動作確認

1. **画面**: Zabbix管理画面の **Administration > Proxies** 一覧を開く
2. **確認**: 該当プロキシのステータスが数分以内に **「Available」** に戻ること
3. **うまくいかない場合**: 「Unavailable」のまま変わらない場合は、以下の「うまくいかない場合」を参照

---

## 手順5: 後片付け

- **操作**: メモした新PSK valueを破棄する
- **操作**: Sensor Edge側のコマンド履歴に新PSK valueが残っている場合は消す
  ```bash
  history -c
  ```

---

## うまくいかない場合

### 「Unavailable」のまま戻らない

- 手順2でPSK identityを誤って変更していないか確認する（valueのみ変更が正しい）
- Sensor Edge上で以下を実行し、認証エラーが出ていないか確認する
  ```bash
  sudo journalctl -u zabbix-proxy -n 30 --no-pager
  ```
- `/etc/zabbix/zabbix_proxy.psk`の所有者・権限（`zabbix:zabbix`、600）が崩れていないか確認する
- 解決しない場合は担当エンジニアに連絡する

### 旧い値に戻したい

旧PSK valueをメモしていなかった場合、元に戻すことはできない。担当エンジニアに連絡し、手順1からやり直す（Zabbix Server側で新しいPSK valueを再度生成し直す）。

## 手順A: 機器を発送するときに登録する

`Sensor Edge/実施手順_顧客追加フロー.md`の手順8（封印・記録・発送）で行う。

1. **画面**: 「Sensor Edge機器登録フォーム」を開く
2. **操作**: 以下を入力する
   - シリアル番号
   - 封印シール番号
   - ホスト名（手順3・手順4で設定した`NEW_HOSTNAME`の値）
   - OSユーザー名
   - SSH公開鍵識別子（分からなければ空欄でよい）
   - 顧客ID（プルダウンから選ぶ。**顧客名は入力不要**、選んだ顧客IDから自動的に記録される）
   - 発送日
   - 備考（任意）
3. **操作**: 送信する
4. **確認**: 管理用スプレッドシートの「機器台帳」タブに、入力した内容の行が追加されていることを確認する（ステータスは自動的に「発送済み」に、顧客名は自動的に補完される）

## 手順B: 故障・不具合を見つけたときに報告する

Sensor Edgeの動作不良・顧客からの故障報告等、何か問題が起きたときに記録する。

1. **画面**: 「故障報告フォーム」を開く
2. **操作**: 以下を入力する
   - 対象シリアル番号（プルダウンから選ぶ。**顧客IDは入力不要**、選んだシリアル番号から自動的に記録される）
   - 発生日時
   - 症状・内容（何が起きているか、できるだけ具体的に）
   - 対応内容（現時点で対応済みのことがあれば）
   - 対応者（自分の名前）
3. **操作**: 送信する
4. **確認**: 担当エンジニア（`yoshihisa.hagisaka@atlib.jp`）に通知メールが自動送信される
5. **その後**: 対応が進んだら、管理用スプレッドシートの「故障履歴」タブを直接開き、該当行の「原因」「対応内容」列を追記する。解決したら「ステータス」を「解決済み」に、「解決日時」を記入する

## 手順C: お客様からの問い合わせに対応する

お問い合わせフォームは顧客が直接入力するため、atLIB側では「届いた問い合わせに対応する」作業を行う。

1. **確認**: 顧客からフォーム送信があると、担当エンジニア（`yoshihisa.hagisaka@atlib.jp`）に通知メールが自動送信される
2. **画面**: 管理用スプレッドシートの「問い合わせ管理」タブを開く
3. **操作**: 新しい行（ステータスが「未対応」）を見つけ、「対応者」列に自分の名前を記入し、「ステータス」を「対応中」に変更する
4. **操作**: 顧客の連絡先メールアドレスへ、通常のメールで返信・対応する
5. **操作**: 対応内容をスプレッドシートの「対応内容」列に記録する。関連するSensor Edge機器があれば「関連シリアル番号」列にも記入する

## 手順D: 機器の情報を調べる

顧客対応中に「この機器の情報を確認したい」場合。

- それでも反映されない場合は担当エンジニアに連絡する（Apps Scriptの設定に問題がある可能性がある）

### 新しい顧客・機器がプルダウンの選択肢に出てこない

- プルダウンの選択肢は1日1回自動更新されるため、当日中に反映したい場合は手動更新が必要

### 通知メールが届かない

- 迷惑メールフォルダを確認する
- スプレッドシート自体には正しく記録されているか確認する（記録されていれば、メール通知のみの不具合の可能性が高い）

### どのフォームを使えばいいか分からない

- 機器を発送するとき → 手順A（機器登録フォーム）

## 目的

これまでラズパイのOSイメージ書き込み・初期ユーザー作成は毎回手作業（Raspberry Pi Imager等）で行われており、全台で同一のデフォルトユーザー名・パスワードを使い回している可能性がある。実機（`atl-zabbixproxy`）の調査でも、sudo実行ユーザーが`atladmin`という共通名であることが確認された。

顧客先に発送後は物理的にatLIBの管理外に置かれ、かつローカル保守は行わない（故障時は交換対応）運用方針のため、**初期構築時点で台ごとに固有の認証情報を設定し、可能な限りパスワード自体を無効化してSSH鍵認証のみに寄せる**ことが最も費用対効果の高い対策になる。

**補足（イメージ再作成は必須ではない）**：手順1（Raspberry Pi Imagerでの台ごとの固有パスワード設定）は、`20260702_SenseEdge構築時投入config.txt`のB2（SSHパスワード認証無効化）が実行されるまでの短い窓（atLIBの手元・発送前のみ存在する窓）を塞ぐための保険的な対策であり、必須ではない。**現行の共通イメージをそのまま使い、B2を実行する前にatLIBの管理用SSH公開鍵を現在のユーザーの`~/.ssh/authorized_keys`へ手動で追加しておく**（`ssh-copy-id`等、現状の共通パスワードでログインした状態で1回実施）だけでも、B2実行後は同等の安全性が得られる（パスワード自体が無効化されるため、元のイメージが共通パスワードだったかは以降の安全性に影響しない）。手順1は「余裕があれば・新規に量産する場合に」実施する位置づけとし、急ぐ場合は手順2（GCPリレーサーバーでの顧客払い出し）から始めてよい。

## 前提

### OS・機材

- **対象ハードウェア: Raspberry Pi 5（1GB RAMモデル）**
  - Zabbix Proxy自体の負荷は軽量（公式最小要件はRAM 1GBで、実運用の監視対象規模に対しても十分な余裕がある。詳細な見積もり根拠は「監視対象機器の上限」を参照）
  - `overlayroot=tmpfs`（手順3のB8）によりOSの書き込み・ログ・Zabbix Proxyのローカルバッファがすべてtmpfs（RAM）上に乗る点に注意。Chiselトンネルが長時間切断した場合、未送信データの蓄積がRAMを圧迫するリスクがあるため、監視対象機器の上限を守ることが重要
  - 2GB以上のモデルでも動作するが、上記の上限を守る前提であれば1GBモデルで標準運用してよい
- OS: Ubuntu Server 24.04 LTS（Raspberry Pi公式イメージではない点に注意。`raspi-config`は使えない前提で手順を組む）
- atLIBが管理用SSH鍵ペアを1組（または技術者ごとに複数）保持していること
- Raspberry Pi Imager（最新版、詳細設定＝OS Customisationが使えるバージョン）

### 監視対象機器の上限

- **1顧客拠点あたり、SNMP監視対象として登録される機器（＝Zabbixホストとして継続ポーリングされる機器）は50台を目安の上限とする**。
  - ここでいう「監視対象機器」は、`setup_discovery.py`のディスカバリで**実際にホスト登録される**台数（SNMP応答機器＋SNMP非応答だがサーバー/プリンター系ポートが開いている機器）を指す。単純にping（ICMP）が通るだけの一般クライアントPC・スマホ等は、ディスカバリイベントとしては記録されるがホスト登録はされないため、この上限のカウント対象外。
  - 中小企業1拠点のインフラ機器（ルーター・スイッチ・AP・プリンター・サーバー）は通常5〜30台程度に収まり、50台はほとんどの想定顧客をカバーしつつ十分な安全マージンを持たせた値（技術的な見積もり上限は100〜300台規模）。
  - 50台を超える規模の企業は、既に何らかの監視ツールを導入済みである可能性が高く、本サービスのターゲット外と判断する。
  - 上限を超える見込みがある場合は、標準の1GBモデルではなく上位RAMモデルへの変更や機材追加を個別見積りとして検討する（プロプランの「お困りごと相談」の延長として扱う）。

### システム構成（GCPリレー・Chisel関連）

- 中継サーバー: `zabbix.atlib.jp` (GCP, project: msp-zabbix, instance: zabbix-server)
- Chiselサーバー: `zabbix.atlib.jp:8080` で待受、`/etc/chisel/users.json` による顧客別PSK認証（2026-07-02〜）
- GCPファイアウォール `allow-infravision-proxy`: `tcp:20001-30000` を開放済み（以後、顧客が増えてもGCP側の追加作業は不要）
- 顧客台帳: `zabbix.atlib.jp:/etc/chisel/customer_ledger.csv`
- 各顧客のSensor Edge（ラズパイ）は `chisel-client.service` で `zabbix.atlib.jp:8080` へアウトバウンド接続し、`R:<顧客ポート>:127.0.0.1:8888`（tinyproxy）をリバース公開
- 顧客環境側のファイアウォール変更は**不要**（アウトバウンド接続のため）

## 手順1: ゴールデンイメージ作成（推奨・必須ではない）

### 1-1. Raspberry Pi Imagerでの書き込み

1. Raspberry Pi Imagerを起動し、対象OSとして「Ubuntu Server 24.04 LTS (64-bit)」を選択
2. 書き込み先SD/eMMCを選択
3. 詳細設定（歯車アイコン、または`Ctrl+Shift+X`）を開き、以下を設定する
   - **ホスト名**：台ごとに固有の名前を設定する（例: `atl-proxy-<customer_code>`。顧客が確定していない先行作成の場合は連番でも可）
   - **ユーザー名／パスワード**：台ごとに異なるランダムパスワードを生成して設定する（使い回さない）。生成したパスワードは、後述の台帳に記録する
   - **SSHを有効化**：「公開鍵認証のみを許可」を選択し、atLIBの管理用SSH公開鍵を登録する
   - **Wi-Fi設定**：設定しない（後述の手順でWi-Fi自体を無効化するため、ここで設定しても意味がない）
4. 書き込みを実行する

### 1-2. 台帳への記録

2026-07-12より、機器の記録は`Sensor Edge/運用手順書_機器管理システム.md`で構築したGWSベースの機器管理システムに一元化した。ホスト名・ユーザー名・登録したSSH公開鍵の識別子等は、この時点では控えのメモに留め、手順8（封印・資産記録・発送）で「Sensor Edge機器登録フォーム」にまとめて入力する（初期パスワードは鍵認証への移行完了後に破棄する運用は変わらない）。

### 1-3. 初回起動・SSH鍵ログイン確認

1. 書き込んだSD/eMMCを対象機に挿入し起動する
2. Ethernet接続の上、atLIBの管理用SSH秘密鍵を使ってログインできることを確認する
3. パスワードでのログインが拒否される（鍵なしでは入れない）ことを確認する

## 手順2: GCPリレーサーバーでの顧客払い出し

`zabbix.atlib.jp` にSSH接続し、以下を実行する。

```bash
sudo /etc/chisel/add_customer.sh <顧客ID>
# 例: sudo /etc/chisel/add_customer.sh customerB
```

出力される以下3つを**必ずメモする**（手順3で使用）。

- `port`（例: 20002）
- `username`（例: customerB-user）
- `password`（自動生成された24文字のPSK）

払い出し後、変更を反映させる。

```bash
sudo systemctl restart chisel-server
```

※再起動により既存顧客全員が一瞬（約1秒）切断→自動再接続する。深夜等の影響が少ない時間帯に実施することが望ましい。

## 手順3: Sensor Edge（ラズパイ）へのconfig.txt投入

手順2（GCPリレーサーバーでの顧客払い出し）を先に実施したうえで、`20260702_SenseEdge構築時投入config.txt`の投入に進む。手順1（イメージ再作成）を行わなかった場合は、ここに進む前に必ず**atLIBの管理用SSH公開鍵を現在のユーザーの`~/.ssh/authorized_keys`へ手動で追加**しておくこと。

`20260702_SenseEdge構築時投入config.txt`には2026-07-05よりB2〜B8のセキュリティハードニング項目（SSHパスワード認証無効化・シリアル/Wi-Fi/Bluetooth/HDMI/USB無効化・overlayroot化）が追加されている。これにより同ファイルはもはや「9行目以下を一気に投入」できず、**3ブロック＋1対話ステップ＋最終rebootに分けて投入する**構成になっている（B2・B4の追加により、一括実行すると自分自身のアクセス経路を切断するリスクがあるため）。各項目の注意書きを読んでから投入すること。

1. `20260702_SenseEdge構築時投入config.txt` を開く
2. 冒頭の5変数を書き換える

   | 変数 | 内容 |
   |---|---|
   | `NEW_HOSTNAME` | 顧客ごとのプロキシ名（Zabbix登録用） |
   | `NEW_PSK_ID` | 顧客ごとのPSK識別子（Zabbix登録用、Chiselとは別物） |
   | `CHISEL_PORT` | 手順2で払い出されたport |
   | `CHISEL_USER` | 手順2で払い出されたusername |
   | `CHISEL_PASS` | 手順2で払い出されたpassword |

3. イメージ展開済みのラズパイに、以下のブロック単位で投入・実行する
   1. **ブロック1**（A・B・B2）を貼り付け・実行し、SSHホスト鍵の再生成とSSHパスワード認証の無効化を行う
      - → **チェックポイント1**：既存セッションを閉じずに別ウィンドウで鍵認証ログインを確認してから次へ進む
   2. **ブロック2**（B3・B4・B5・B6・B8）を貼り付け・実行する。いずれもconfig.txt編集または次回起動時に効く設定のみで、この時点では何も切断されない
   3. **B7（対話ステップ）**：`sudo rpi-eeprom-config --edit`を単独で実行し、`BOOT_ORDER`を内蔵ストレージのみに変更する
   4. **ブロック3**（C〜I）を貼り付け・実行し、Chisel/Zabbix Proxy設定とネットワーク設定を行う
   5. **最終チェックポイント→reboot**：`ip -brief link`でEthernet(eth0)がUP・DHCP取得済みであることを確認してから`sudo reboot`する（Wi-Fiはrebootと同時に消えるため、reboot前に必ずEthernet接続を確立しておくこと）
   6. **reboot後の確認**：Ethernet経由・鍵認証でSSHログインできること、`wlan0`が存在しないこと、chisel-client/zabbix-proxyが正常稼働していることを確認する（手順7と対応）
4. 最後に表示される **Hostname / PSK Identity / PSK Key** を必ずメモに保存（手順5で使用）
5. ブロック3内の接続確認で `Connected` のログが出ることを確認

## 手順4: ディスク暗号化（Clevis + Tang）バインド（将来対応・別途実装）

本項目は設計のみ確定済みで、Tangサーバー構築を含む実装は別セッションで行う。実装後は、本手順3と4の間に以下を追加する想定。

1. Sensor Edge側でルートファイルシステム（またはPSK等を含む重要パーティション）をLUKS化
2. `clevis luks bind`でTangサーバー（`zabbix.atlib.jp`上に構築予定）にバインド
3. ネットワークを切断した状態で再起動を試み、復号できずに起動が止まることを確認する（バインドが正しく機能している証跡）

## 手順5: Zabbix Serverへのホスト登録

手順3で得た `Hostname` / `PSK Identity` / `PSK Key` を使い、Zabbix管理画面（`https://zabbix-admin.atlib.jp/`、Cloud IAP経由）でProxyオブジェクトを新規作成する。

1. **Administration（管理） > Proxies（プロキシ）** を開き、右上の **Create proxy**（プロキシの作成）をクリック
2. 「Proxy」タブで以下を入力
   - **Proxy name**: 手順3の `NEW_HOSTNAME`（例: `atlib-proxy-01`）と完全に一致させる（`zabbix_proxy.conf`の`Hostname=`と紐付けキーになるため）
   - **Proxy mode**: **Active**（Sensor Edge側からChiselトンネル経由でZabbix Serverへアウトバウンド接続する構成のため。Passiveは選択しない）
   - **Proxy group**: 未設定のままでよい（単体運用のため）
3. 「Encryption」タブで以下を設定
   - **Connections to proxy**（Zabbix ServerからProxyへの接続時）: `PSK` にチェック（`No encryption`のみだと平文接続も許可されてしまうため、`PSK`のみにチェックし`No encryption`は外すことを推奨）
   - **PSK identity**: 手順3の `NEW_PSK_ID`（例: `PSK-CUSTOMER-01`）
   - **PSK value**: 手順3の投入完了時に表示された `PSK Key`（64文字の16進数文字列）
4. **Add**（追加）をクリックして保存する
5. 保存後、一覧画面で該当Proxyのステータスが数分以内に「Available（使用可能）」に変わることを確認する（Chiselトンネル＋zabbix-proxyサービスが正常に稼働していれば自動的に接続される）。「Unknown」のまま変化しない場合は手順9（顧客側での起動・疎通確認）のトラブルシューティングを参照

> **既存設定の参考値**：現在稼働中の`atlib-proxy-01`（proxyid=1）は`operating_mode=0`（Active）、`tls_accept`にPSKを含む設定で稼働している。新規作成時もこれに合わせること。

## 手順9: 顧客側での起動・疎通確認（我々側からの確認方法）

顧客がラズパイを設置・起動したら、**GCPリレーサーバー側から**以下で確認できる（顧客のSensor Edgeへ直接SSHできない前提）。

```bash
# 1. Chiselサーバーがそのユーザーの接続を受けているか
sudo journalctl -u chisel-server --since "10 min ago" | grep <username>

# 2. 該当ポートで実際にリバース転送が張られているか
sudo ss -tlnp | grep :<CHISEL_PORT>
```

あわせて、Zabbix Server側で該当プロキシが「使用可能(Available)」表示になっているかを確認する（これはChiselトンネルとは独立した、Zabbix Proxy→Zabbix Serverの疎通確認になる）。

Windows側の起動bat（手順6で作成したもの）を実際に実行し、ブラウザで対象機器の管理画面が表示されることを確認して完了とする。

## 手順10: 契約終了・返却・改ざん疑い時の認証情報失効

Sensor Edgeは物理的にatLIBの管理外に置かれる機器であり、内容の完全な保護（SDカード抜き取りによる読み取り等）は技術的に不可能という前提に立つ。そのため、以下のタイミングでは**速やかに認証情報を失効・ローテーションする**ことを標準運用とする。

- 契約終了・機器返却時
- 封印シールの破損・改ざんを検知した時
- その他、不正な持ち出し・転用の疑いが生じた時

失効させる対象：

1. **Chisel認証情報**：`customer_ledger.csv`の該当顧客の`username`/`password`を無効化し、`/etc/chisel/users.json`から該当エントリを削除、`systemctl restart chisel-server`で反映する
2. **Zabbix Proxy PSK**：Zabbix管理画面で該当Proxyホストを削除、またはPSKを再生成する
3. （Clevis+Tang導入後）Tangサーバー側で該当デバイスの鍵解決を無効化し、返却された機器のSDカード内容が復号不能であることを確認する

この失効作業は顧客ごとに個別のPSK・認証情報を持つ設計になっているため、他顧客への影響なく実施できる。

---

## トラブルシューティング

### 顧客先のブラウザ/SSHアクセスがタイムアウトする

Sensor Edge側のtinyproxyが詰まっている可能性がある（2026-07-01に実際に発生した既知の障害。原因はlogrotateの`reload`シグナルでtinyproxyのログFDが壊れ、ワーカースレッドが枯渇する不具合）。

対策済み: `/etc/logrotate.d/tinyproxy` のpostrotateを `reload` → `restart` に変更し、深夜の定期ローテートでは再発しない設定にしてある（2026-07-02対応）。それでも発生した場合は、当該Sensor Edgeへ直接SSHし `sudo systemctl restart tinyproxy` で復旧する。

### 新規顧客が繋がらない

- `add_customer.sh` 実行後に `systemctl restart chisel-server` を忘れていないか確認
- Sensor Edge側の `CHISEL_USER`/`CHISEL_PASS` が手順2の払い出し値と一致しているか確認（手打ちミスに注意）
- 台帳(`customer_ledger.csv`)とusers.jsonの内容が一致しているか確認

## 手順1: Sensor Edge設置・Zabbix Proxy登録（全顧客必須）

**MSPサービスとして「リモート監視・運用」を提供する以上、監視対象がインターネットから直接到達可能かどうかに関わらず、Sensor Edgeは全顧客に対して必ず設置する。**「Sensor Edgeが必要かどうか」の判断は不要（条件分岐なし）。

具体的な作業手順（ゴールデンイメージ作成、GCPリレーサーバーでの顧客払い出し、ラズパイへの設定投入、Zabbix Serverへのホスト登録、発送、疎通確認）は `Sensor Edge\運用手順書_顧客追加フロー.md` の手順1〜9をそのまま参照する（重複記載しない）。

**完了条件（次の手順に進む前に必ず確認）**：
- Zabbix管理画面で当該Proxyが「使用可能（Available）」表示になっていること
- 発行された **`proxyid`**（Zabbix Proxy ID）を控えていること（手順2で使用する）

> **順序制約（重要）**：`msp-customer-portal`のDBスキーマ上、`zabbix_proxy_id`は顧客レコード作成時にのみ設定でき、後から更新する手段がコード上用意されていない。そのため、**必ず本手順を完了させてから手順2のオンボーディングスクリプトを実行すること**。逆順で実行してしまった場合、現状は手動でのDB編集以外に是正手段がない。

---

## 手順2: ポータルオンボーディングスクリプト実行

```bash
npm run onboard -- \
  --code <customer_code> \
  --name "<company_name>" \
  --email <連絡先メールアドレス> \
  [--plan "<プラン名>"]... \
  --proxy-id <手順1で控えたproxyid> \
  --ip-range <手順0で確認した顧客のネットワークレンジ、例: 192.168.1.1-254>
```

自動的に以下が実行される（`scripts/onboarding/create_customer.ts`）。

1. ホストグループ作成（`MSP/{company_name}`、プラン指定があればサブグループも作成）
2. 通知用Zabbixユーザー作成（`notify_{customer_code}`）
3. 顧客専用アクション作成（`{customer_code}_alert`）
4. DBへのレコード登録（`zabbix_proxy_id`含む）
5. 初回パスワード通知メールの送信

`customer_code`の重複は自動チェックされ、既に登録済みの場合はエラーで停止する（二重登録防止・実装済み）。

実行完了時、コンソールに**手順3でそのまま使う`setup_discovery.py`のコマンド**が表示される（`--ip-range`を指定していれば埋め込み済み、未指定なら手順3実行前に手で埋める）。

**あわせて実施**：Sensor Edge機器管理システム（`Sensor Edge/運用手順書_機器管理システム.md`）の「顧客マスタ」タブに、`customer_code`・`company_name`を1行追加する（自動連携はしていないため手動）。この登録が漏れると、Sensor Edge機器登録フォームの顧客IDプルダウンに新顧客が出てこない。

---

## 手順3: ディスカバリルール・アクションのセットアップ

顧客の機器自動検出は、顧客ごとに個別のディスカバリルール（`MSP_インフラ自動検知_{customer_code}`）を作成する方式。以前は全顧客共通のルール「ユーザー用インフラ自動判別」を使っていたが、テスト運用の混乱を経て2026-07-09に顧客ごとの複製方式へ移行済み（詳細は`zabbixserver/batch/setup_discovery.py`のdocstringを参照）。

手順2の完了時に表示されたコマンドを、`msp-frontend-server`にSSHしてそのまま実行する。

```bash
gcloud compute ssh msp-frontend-server --zone=asia-northeast1-a --tunnel-through-iap
cd /opt/atlib-msp-dev/zabbixserver/batch
python setup_discovery.py --dry-run --customer-code <code> --company-name "<name>"   # まず内容確認
python setup_discovery.py --apply ...   # 手順2の出力をそのまま貼り付け
```

**注意（Cloud Runからは実行できない）**：本手順はmsp-customer-portalの本番実行環境（Cloud Run）からは実行できない。Pythonが搭載されておらず、Zabbixサーバーへの直接到達性もない（VPC内部からのみ到達可能）ため。

これにより自動的に作成されるもの:
1. ディスカバリルール`MSP_インフラ自動検知_{code}`（ICMP・SNMP・プリンター/サーバー系TCPポートの標準チェックリストで、指定したIPレンジをスキャン）
2. アクション`MSP_SNMP機器登録_{code}`（SNMP応答機器を`MSP/{company_name}`グループへ自動登録）
3. アクション`MSP_ICMPフォールバック登録_{code}`（SNMP非対応機器のフォールバック登録）
4. アクション`MSP_新規機器検知通知_{code}`（新規機器検出時の通知。**作成時は無効状態**。社内(atladmin)向けの動作確認が別途必要。顧客への通知は、顧客がポータルの通知設定ページで「未知機器の検出」トグルを有効化した場合のみ届く）

**完了条件**：`--dry-run`で3つのアクションが「作成済み」と表示されること。

---

## 手順4: 顧客への引き渡し

- 歓迎メール（手順2で自動送信）が実際に届いていることを確認
- 顧客に初回ログイン手順・パスワード再設定手順を案内する
  - ログインURL: ポータルの `/login.html`
  - パスワードをお忘れの場合は `/reset-password.html` から再設定可能
- 必要であれば、通知設定ページの「未知機器の検出」トグルについても案内する（デフォルト無効）
- 「トポロジー」画面（`/topology.html`）を案内する。顧客側で機器の役割（ルーター/スイッチ/AP/プリンター等）や、LLDPで自動検出できない機器の上位接続先・ケーブル種別・上位ポートを設定できる旨、および月次報告書にも同じ内容が反映される旨を伝える

---

## 手順5: 監視開始の確認

- 手順3のディスカバリルールにより機器が自動登録され、ポータルの「機器管理」画面に一覧表示されることを確認する
- 顧客が自動登録された機器のうち不要なものを、ポータルから無効化・削除できることを案内する

> **注意（削除 vs 無効化）**：ポータルから機器を「削除」しても、その機器が引き続きネットワーク上で稼働している場合、次回のディスカバリサイクルで再度検出・登録される可能性がある（無効化と異なり、削除は「未知の機器」として扱われ直すため）。**恒久的に監視を止めたい場合は、削除ではなく無効化を推奨する**旨を顧客への案内に含める。

---

## 手順11: 契約終了時のポータル側後処理

Sensor Edge側の機器回収・認証情報失効は`Sensor Edge/運用手順書_顧客追加フロー.md`手順10を参照（Chisel認証情報・Zabbix Proxy PSKの失効はそちらに従う）。本手順は、それと対になる**顧客ポータル側**の後処理を扱う。

### 11-1. ポータルログインを即座に無効化する

`msp-customer-portal`の`customerRepo`には現状、顧客の`status`を更新するAPIエンドポイント・スクリプトが用意されていないため、Cloud SQL Auth Proxy経由でのSQL実行が必要（`msp-customer-portal-db`インスタンス、接続方法は本ドキュメント・過去の障害対応記録を参照。作業前に関係者の承認を得ること）。

```sql
UPDATE customers SET status = 'suspended', updated_at = now() WHERE customer_code = '<対象customer_code>';
```

`findByEmail`/`findById`は`status = 'active'`のみを対象とするため、この更新のみでログイン・API利用が即座にできなくなる（アプリケーションコード側の変更は不要）。

### 11-2. Zabbix側のホストグループ・ホストは即削除せず一定期間保持する

- 契約終了直後は、当該顧客のホストグループに属する全ホストを**無効化**（`host.update`で`status=1`）するに留め、**削除はしない**
- 保持期間（目安1〜3ヶ月、契約内容に応じて調整）経過後、問題なければホストグループごと削除する
- 通知用Zabbixユーザー（`notify_{customer_code}`）・顧客専用アクション（`{customer_code}_alert`、`MSP_新規機器検知通知_{code}`等）も同様に、即削除ではなく無効化を先に行う

### 11-3. データ保持方針

- ポータルDB（`customers`テーブル）のレコード自体は、`suspended`のまま一定期間（Zabbix側と同じ保持期間の目安）保持し、監査・問い合わせ対応に備える
- 保持期間経過後にレコードを削除する場合、`customer_hostgroups`は`ON DELETE CASCADE`で連動削除される（`migrations/001_init.sql`参照）ため、`customers`テーブルの削除のみで両方消える

## トラブルシューティング

### `npm run onboard` 実行後、顧客がログインできない

- 歓迎メールが迷惑メール判定されていないか確認する
- SMTP送信元（`yoshihisa.hagisaka@atlib.jp`のアプリパスワード経由、暫定運用）の送信制限に達していないか確認する

### 機器管理画面に自動登録された機器が表示されない

- 手順3を実行し忘れていないか（`setup_discovery.py --dry-run`で当該顧客のルール・アクションが作成済みか確認）
- 指定した`--ip-range`が顧客の実際のネットワークレンジと一致しているか確認する
- Zabbix管理画面で、当該顧客のホストグループに実際にホストが追加されているか直接確認する

### `zabbix_proxy_id`を手順1より先に顧客登録してしまった

- 現状、`customerRepo`に更新用メソッドがないため、Cloud SQLへの手動UPDATEが必要になる。実施する場合は関係者の承認を得た上で慎重に行うこと（顧客の実データを直接更新する操作のため）

## 手順3: 日次バッチのスケジュール実行（systemdタイマー）

CVE/EoL突合・LLDP新規ネイバー検知バッチを毎日AM2:00（±5分のランダム遅延）に自動実行する。Windows用の`setup_scheduler.ps1`（`zabbixserver/batch/`配下）はこのVM（Debian）には適用できないため、Linux版としてsystemdタイマーを使う。

```bash
# run.sh・ユニットファイルをシンボリックリンク化

sudo chmod +x /opt/atlib-msp-dev/zabbixserver/deploy/run.sh
sudo ln -sf /opt/atlib-msp-dev/zabbixserver/deploy/msp-security-batch.service /etc/systemd/system/msp-security-batch.service
sudo ln -sf /opt/atlib-msp-dev/zabbixserver/deploy/msp-security-batch.timer /etc/systemd/system/msp-security-batch.timer

# 反映してタイマーを有効化
sudo systemctl daemon-reload
sudo systemctl enable --now msp-security-batch.timer
```

`run.sh`は実行のたびにSecret Managerから最新の`ZABBIX_PASSWORD`を取得するため、`/etc/msp-batch/env`のパスワードが陳腐化していても正しく動作する（該当ファイルの`ZABBIX_URL`/`ZABBIX_USER`のみ使用する）。

# 手動で今すぐ1回実行してテストする

# 実行ログの確認

```

## 手順5: ルートURL（`/`）のリダイレクト設定（nginx）

`https://topology.zabbix.atlib.jp/`のルートは、`atlib_monthly_report.html`（月次レポートツール）へ301リダイレクトする設定にしている（2026-07-11設定）。以前はルートに無関係な試作デバッグページ（`index.html`、LLDPデータ確認用）が表示されており、そこにZabbix APIトークンが平文でハードコードされているセキュリティ問題があったため、該当ページは撤去しリダイレクトへ切り替えた。

設定はVM側の`/etc/nginx/sites-enabled/default`（git管理外）に記載。`location / {...}`ブロックより前に、以下の完全一致ロケーションを追加している。

```nginx
        # ルート（/）へのアクセスは月次レポートツールへリダイレクト
        location = / {
                return 301 /atlib_monthly_report.html;
        }

        # GCP HTTPS Load BalancerのヘルスチェックはHTTPS:443の"/"に200を期待するため、
        # 上記の/リダイレクトとは別に、リダイレクトしない専用のヘルスチェック用パスを用意する
        location = /healthz {
                add_header Content-Type text/plain;
                return 200 'ok';
        }
```

設定変更後は必ず`sudo nginx -t`で検証してから`sudo systemctl reload nginx`を実行すること。変更前の設定は`/etc/nginx/backup/`配下にバックアップ済み（**`/etc/nginx/sites-enabled/`直下に`.bak`等の別名で置くと、nginxがそれもサーバーブロックとして読み込み`duplicate default server`エラーになるため厳禁**）。

また、`/var/www/html/`直下にあった試作の残骸（`index.html`・`report.html`・`test.html`・`atlib_monthly_report.js`・`atlib_monthly_report.html.bak_20260703_063801`）は削除ではなく`/var/www/html_archive/`へ退避済み（参照漏れがあった場合に備え、当面保持する）。

**確認コマンド:**

```bash
curl -sk -o /dev/null -w 'HTTP %{http_code} -> %{redirect_url}\n' https://localhost/ -H 'Host: topology.zabbix.atlib.jp'
# => HTTP 301 -> https://topology.zabbix.atlib.jp/atlib_monthly_report.html

curl -sk -o /dev/null -w 'HTTP %{http_code}\n' https://localhost/healthz -H 'Host: topology.zabbix.atlib.jp'
# => HTTP 200
```

### インシデント記録（2026-07-11）: `/`リダイレクト導入によるLBヘルスチェック失敗

上記の`location = /`リダイレクトを導入した直後、`https://topology.zabbix.atlib.jp/`へのアクセスがGCP Load Balancerの汎用エラーページ（"The server encountered a temporary error..."）になる障害が発生した。VM上のnginxを`localhost`＋Hostヘッダー指定で直接テストした際は正しく301が返っており、この経路のテストだけでは検知できなかった（LB自体を経由しない検証だったため）。

原因は、GCPヘルスチェック`msp-frontend-hc-443`が`requestPath: /`に対して200 OKを期待する設定になっており、`/`が301を返すようになったことでヘルスチェックが失敗し、バックエンドサービス`msp-frontend-bes`が丸ごとUNHEALTHY判定されたこと（`gcloud compute backend-services get-health msp-frontend-bes --global`で確認）。

対応: 上記のとおり、リダイレクトしない専用の`/healthz`エンドポイントをnginxに追加し、ヘルスチェックのリクエストパスをそちらへ変更した。

```bash
gcloud compute health-checks update https msp-frontend-hc-443 --request-path=/healthz
```

**教訓**: VM上のnginxを`localhost`経由で直接叩くテストは、GCP Load Balancer/IAPを経由する実際のアクセス経路の検証にはならない。今後`/`や既存パスの挙動を変更する場合は、変更後に`gcloud compute backend-services get-health <backend-service> --global`でバックエンドの健全性を必ず確認すること。

## 運用上の注意: アイテムを無効化する際はトリガーも合わせて無効化する

Zabbixでアイテムを無効化（status更新）しても、そのアイテムに依存するトリガーは自動では無効化されない。
無効化した時点でトリガーが**PROBLEM状態だった場合、アイテムが二度とデータを送らなくなるため、
トリガーのvalueがPROBLEMのまま永久に固着する**（`trigger.update`でトリガー自体を無効化しても、
`status`は無効になるが`value`は更新されずPROBLEMのまま残る）。

2026-07-11、`atl-printer`のICMP系アイテム（`icmpping`/`icmppingloss`/`icmppingsec`、省電力モードで
ICMP応答が不安定になるため無効化）でこれが発生し、`msp-customer-portal`のトポロジー画面（障害オーバーレイ）で
当該機器が永続的に赤表示になる不具合につながった。`getTopologyData`（`msp-customer-portal/src/services/zabbixClient.ts`）
はトリガーの`status`（有効/無効）を見ずに`value`（PROBLEM/OK）のみで障害判定していたため、無効化された
トリガーの固着したPROBLEM状態もそのまま拾ってしまっていた。対応として、①依存する3トリガー
（`Unavailable by ICMP ping`・`High ICMP ping loss`・`High ICMP ping response time`）を無効化、
②`getTopologyData`側も`status==='0'`（有効なトリガーのみ）を障害条件に追加する修正を行った。

**教訓**: アイテムを無効化するときは、依存するトリガーも同時に無効化すること。また、Zabbixのトリガー状態を
外部システム（今回のポータルのように）で参照する実装は、`value`だけでなく`status`も必ず確認すること。

## 運用上のルール: 機器の役割（トポロジー図の表示分類）は顧客ポータルで設定する

`atlib_monthly_report.html`のトポロジー図・インターフェース一覧で表示される実機の「役割」（ルーター/
スイッチ/AP/プリンター等）は、Zabbixホストタグ（`tag="role"`）に保存されている。**このタグへの書き込みは
`msp-customer-portal`（顧客ポータル、`public/topology.html`）からのみ行う**運用に統一した（2026-07-11）。
`atlib_monthly_report.html`側は読み取り専用で、実機の役割編集UIは存在しない（🔒アイコンで表示のみ）。

以前はブラウザの`localStorage`にホスト名をキーとして役割を保存しており、`atlib_monthly_report.html`と
顧客ポータルそれぞれで別々に、かつブラウザ・スタッフごとに別々に保存されるため、一方で設定した内容が
他方に反映されない問題があった。Zabbixホストタグへの一元化によりこれを解消した。

なお、`atlib_monthly_report.html`で管理する「監視外機器（手動追加ホスト）」はZabbix上に実体がないため、
この一元化の対象外（従来どおりlocalStorageで管理）。

同様に、LLDP非対応機器の「上位接続先」「ケーブル種別」「上位ポート」も`tag="uplink"`/`tag="cableType"`/
`tag="uplinkPort"`としてZabbixホストタグに一元化し、顧客ポータルからのみ書き込む運用にした
（2026-07-11、Phase 5-c/5-d）。トポロジー図の階層（level）も、役割の固定値ではなくこれらのタグから
辿った実際の接続の深さで決めるようにしている（同一役割の機器が同じ段に並んで接続線が重なる問題の対策）。

## トラブルシューティング

### `git pull`が認証エラーになる

Deploy Keyが失効・削除されていないかGitHub側の設定を確認する。鍵を再生成する場合は手順2の2〜4をやり直す。

### `main.py --dry-run`が権限エラーになる

`/opt/msp-batch/batch/reports/`ディレクトリの所有者が、実行しているOSユーザーと一致しているか確認する（このVMには`hagisaka`と`YoshihisaHagisaka`という別ユーザーが混在しているため、実行ユーザーによって権限エラーになることがある）。日次バッチは`/etc/msp-batch/env`（root:root）を読む必要があるため、実運用では`sudo`（root権限）での実行を前提とする。

### `/etc/msp-batch/env`のパスワードが古い

`atladmin`のパスワードはGCP Secret Manager（`zabbix-api-password`、project: msp-zabbix）で管理されている。`/etc/msp-batch/env`のファイル自体（`ZABBIX_PASSWORD`の値）は追従できておらず陳腐化しているが、`zabbixserver/deploy/run.sh`が実行のたびにSecret Managerから最新値を取得して上書きするため、`systemctl start msp-security-batch.service`や日次実行では問題にならない。`/etc/msp-batch/env`から使われるのは`ZABBIX_URL`/`ZABBIX_USER`のみ。

`main.py`を`run.sh`経由せず直接手動実行する場合（動作確認等）は、以下でSecret Managerから直接取得して上書きすること。

```bash
TOKEN=$(curl -s -H "Metadata-Flavor: Google" \
  "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token" \
  | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
export ZABBIX_PASSWORD=$(curl -s -H "Authorization: Bearer ${TOKEN}" \
  "https://secretmanager.googleapis.com/v1/projects/msp-zabbix/secrets/zabbix-api-password/versions/latest:access" \
  | python3 -c 'import sys,json,base64; d=json.load(sys.stdin); print(base64.b64decode(d["payload"]["data"]).decode())')
```

恒久対応としては、`/etc/msp-batch/env`のパスワードを都度更新する運用に切り替えるか、`config.yaml`読み込み自体をSecret Manager参照に統一することが望ましい。

## 手順3: Secret Managerのシークレットを更新する

作業端末（gcloud認証済み）で実行する。

### 手順3-0: gcloud認証を確認する

Secret Managerへの書き込み権限を持つアカウントでログインし直す。

```powershell
gcloud.cmd auth login
```

**注意（パスワード入力プロンプトが出た場合）**: `gcloud secrets versions add`などの機密操作を実行すると、`Reauthentication required. Please enter your password:`という**Googleアカウントのパスワード**を求めるプロンプトが表示されることがある（Windowsのパスワードではない）。これに何度入力しても通らない場合は、`Ctrl+C`で中断し、上記の`gcloud.cmd auth login`でブラウザ経由の再認証をやり直すこと。2段階認証・SSOを使っているアカウントでは、この場でのパスワード直接入力では通らないことがある（2026-07-05に実際に発生）。

### 手順3-1: シークレットを更新する

```powershell
# 新しいパスワードをファイルに書き出す（BOMなしで書き出すこと。文字化け・認証失敗の原因になる）
$passBytes = [Text.Encoding]::UTF8.GetBytes("ここに手順1で生成した新パスワード")
[IO.File]::WriteAllBytes("$env:TEMP\zabbix_pass_new.txt", $passBytes)

# 新バージョンとして登録（既存バージョンは自動的に無効化されず残る。ロールバック用に保持される）
gcloud.cmd secrets versions add zabbix-api-password --data-file="$env:TEMP\zabbix_pass_new.txt" --project=msp-zabbix

# ローカルの一時ファイルを削除
Remove-Item "$env:TEMP\zabbix_pass_new.txt" -Force
```

**重要**: `-Encoding utf8`を指定した`Out-File`ではなく、上記のように`[IO.File]::WriteAllBytes`を使うこと。Windows PowerShell 5.1の`Out-File -Encoding utf8`はUTF-8 BOM付きで書き出すため、Secret Managerに登録した値の先頭に不可視文字が混入し、Zabbixログインが失敗する原因になる（2026-07-04に実際に発生した障害）。

**注意（実行ポリシーエラー）**: 通常のPowerShellウィンドウでは実行ポリシーが既定で`Restricted`相当になっており、`gcloud`（実体は`gcloud.ps1`）が「このシステムではスクリプトの実行が無効になっている」エラーで弾かれることがある。その場合は上記のように`gcloud`の代わりに`gcloud.cmd`を使うか、事前に`Set-ExecutionPolicy -Scope CurrentUser -ExecutionPolicy RemoteSigned`を実行しておくこと。

- 手順2でZabbix側の変更が正しく保存されているか、Zabbix管理画面で再確認する

### ロールバック（変更前の状態に戻す）

Secret Managerは旧バージョンを自動削除しないため、直前のバージョンに戻すことで即座にロールバックできる。

```powershell
# バージョン一覧を確認
gcloud.cmd secrets versions list zabbix-api-password --project=msp-zabbix

# 特定の旧バージョンを再度「latest」として使いたい場合は、そのバージョンの内容を新バージョンとして追加し直す
# （Secret Managerには「特定バージョンをlatestに戻す」直接的な機能はないため、
#   旧バージョンの内容を取得し、新バージョンとして再登録する）
```

ただし、Zabbix側のパスワード自体を手順2で既に変更している場合、Secret Manager側だけ戻しても不整合になる。ロールバックする場合は、Zabbix側のパスワードも手順2の操作で旧パスワードに戻すこと。

---

## 手順7: 後片付け

- 新パスワードをメモした場合は破棄する
- 必要に応じて、2世代以上前の古いSecret Managerバージョンを無効化する（削除はしない。監査目的で履歴は残す）

```powershell

```

最終更新: 2026-07-05
対象: zabbix-server（GCP, asia-northeast1-a）上のPostgreSQL `zabbix`ユーザーのパスワード

## 背景

作業中の事故で、このDBパスワードがClaude Codeのローカル設定ファイル（`.claude/settings.local.json`）に平文でコマンド履歴として残ってしまっていた。GitHubにpushする前に発見・除外はしたが、念のため実際のパスワードもローテーションしておく。

## 影響を受けるファイル（2箇所、両方更新が必要）

- `/etc/zabbix/zabbix_server.conf`（`DBPassword=`）
- `/etc/zabbix/web/zabbix.conf.php`（`$DB['PASSWORD']`）※`/usr/share/zabbix/conf/zabbix.conf.php`はこのファイルへのシンボリックリンクなので実体は1つ

## リスク

設定ミスがあると **zabbix-serverがDBに接続できなくなり、全顧客の監視が停止する**。必ずバックアップを取り、変更後は起動確認をしてから作業完了とすること。業務影響の少ない時間帯での実施を推奨する。

---

## 手順1: zabbix-serverにSSH接続する

```powershell
ssh -i "$env:USERPROFILE\.ssh\google_compute_engine" yoshihisa_hagisaka@34.85.69.73
```

（IPは変わっている可能性があるため、`gcloud compute instances describe zabbix-server --zone=asia-northeast1-a --format="value(networkInterfaces[0].accessConfigs[0].natIP)"`で最新のIPを確認してもよい）

## 手順2: 新しいパスワードを生成する

```bash
NEWPASS=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 32)
echo "生成完了（長さ: ${#NEWPASS}）"
```

※ `echo $NEWPASS` などでパスワード自体を画面に表示しないこと。長さの確認だけに留める。

## 手順3: 設定ファイルをバックアップする

```bash
sudo mkdir -p /root/backups
sudo cp /etc/zabbix/zabbix_server.conf /root/backups/zabbix_server.conf.bak_$(date +%Y%m%d_%H%M%S)
sudo cp /etc/zabbix/web/zabbix.conf.php /root/backups/zabbix.conf.php.bak_$(date +%Y%m%d_%H%M%S)
```

## 手順4: PostgreSQL側のパスワードを変更する

```bash
sudo -u postgres psql -c "ALTER USER zabbix WITH PASSWORD '${NEWPASS}';"
```

## 手順5: 設定ファイルを更新する

```bash
sudo sed -i "s/^DBPassword=.*/DBPassword=${NEWPASS}/" /etc/zabbix/zabbix_server.conf
sudo sed -i "s|\\\$DB\['PASSWORD'\].*=.*|\$DB['PASSWORD']\t\t\t= '${NEWPASS}';|" /etc/zabbix/web/zabbix.conf.php
```

反映内容を確認する（値は表示せず、行が存在することだけ確認）。

```bash
sudo grep -c "^DBPassword=" /etc/zabbix/zabbix_server.conf
sudo grep -c "DB\['PASSWORD'\]" /etc/zabbix/web/zabbix.conf.php
```

## 手順6: zabbix-serverを再起動し、接続確認する

```bash
sudo systemctl restart zabbix-server
sleep 3
sudo systemctl status zabbix-server --no-pager | head -10
sudo tail -20 /var/log/zabbix/zabbix_server.log
```

`Zabbix Server ... started`のようなログが出て、DB接続エラー（`database is down` 等）が出ていなければ成功。

## 手順7: Webフロントエンドの動作確認

```bash
sudo systemctl reload php8.3-fpm
```

その後、ブラウザで `https://zabbix-admin.atlib.jp/`（Cloud IAP経由）にアクセスし、Zabbixのログイン画面が正常に表示されること、ログインできることを確認する。

## 手順8（問題発生時のロールバック）

```bash
# 設定ファイルを復元
sudo cp /root/backups/zabbix_server.conf.bak_<タイムスタンプ> /etc/zabbix/zabbix_server.conf
sudo cp /root/backups/zabbix.conf.php.bak_<タイムスタンプ> /etc/zabbix/web/zabbix.conf.php

# PostgreSQL側も旧パスワードに戻す（旧パスワードを別途安全な場所から確認できる場合のみ）
sudo -u postgres psql -c "ALTER USER zabbix WITH PASSWORD '<旧パスワード>';"

sudo systemctl restart zabbix-server
sudo systemctl reload php8.3-fpm
```

## 手順9: 後片付け

- ターミナルの入力履歴に新パスワードが残っている場合、コマンド履歴をクリアする（`history -c`など）

<script type="text/plain" id="src-psk-proxy">
最終更新: 2026-07-12
対象: 顧客拠点のSensor Edge上で稼働するZabbix ProxyのPSK（事前共有鍵）
関連ドキュメント: [Sensor Edge/運用手順書_顧客追加フロー.md](../Sensor%20Edge/運用手順書_顧客追加フロー.md)（手順3・手順5・手順10）

## 前提となる構成

- 対象: 顧客ごとに個別のZabbix Proxy（例: `atlib-proxy-01`）が持つPSK identity・PSK value
- PSK identityの命名規則: `PSK-CUSTOMER-<顧客ID>`（`Sensor Edge/運用手順書_顧客追加フロー.md`手順3の`NEW_PSK_ID`）
- PSK valueの保管場所: Sensor Edge上の`/etc/zabbix/zabbix_proxy.psk`（32バイトの16進数文字列、`openssl rand -hex 32`で生成）
- Zabbix Server側の設定場所: Administration > Proxies > 該当Proxy > Encryptionタブ

**推奨頻度**: atladmin・DBパスワードと同様、3〜6ヶ月に1回、または以下のタイミングで都度実施。
- 封印シールの破損・改ざんを検知した時
- 契約終了・機器返却時（この場合はローテーションではなく失効。`運用手順書_顧客追加フロー.md`手順10を参照）
- その他、不正な持ち出し・転用の疑いが生じた時

---

## 前提条件（重要）: Sensor Edgeへのリモートアクセス経路

このローテーション作業は、**Sensor Edge本体にログインして`/etc/zabbix/zabbix_proxy.psk`を書き換える必要がある**。Sensor Edgeは顧客先のプライベートネットワーク内にあり、`運用手順書_顧客追加フロー.md`が前提とする通り直接SSHはできない。

`InfraVision_Launcher_Template.bat`のコメントにある通り、Sensor Edge自身が動かすtinyproxy（HTTP CONNECTプロキシ）経由で、**Sensor Edge自身のLAN IPアドレスのSSHポート(22)へ折り返して接続する**ことで到達できる（tinyproxyはSensor Edgeのネットワーク位置から任意の宛先へCONNECTするため、宛先にSensor Edge自身のLAN IPを指定すれば自分自身のsshdに到達する）。

PuTTYの設定例:
- Session: Host=`<Sensor EdgeのLAN IP>`, Port=`22`
- Connection > Proxy: Proxy type=`HTTP`, hostname=`zabbix.atlib.jp`, Port=`<当該顧客のCHISEL_PORT>`

**課題**: この方法には、Sensor Edge自身の現在のLAN IPアドレスを事前に知っている必要があるが、現状DHCPで自動取得する構成（`運用手順書_顧客追加フロー.md`手順3のF項）のため、台帳にこのIPが記録されていない場合は把握できない。

**恒久対応の推奨**: 今後の新規展開時は、顧客のルーターでSensor EdgeのMACアドレスに対しDHCP予約（固定IP割当）を設定してもらうか、`netplan`側で固定IPを設定し、そのIPを顧客台帳（`customer_ledger.csv`と同様の管理台帳）に記録しておくことを推奨する。既存展開済みの機器でIPが不明な場合は、顧客に依頼してルーターのDHCPクライアント一覧から該当機器（ホスト名`NEW_HOSTNAME`で設定した名前、例: `atlib-proxy-01`）のIPを確認してもらう。

---

## 手順1: 新しいPSKを生成する

Sensor Edgeへの接続後、**Sensor Edge上で**実行する（`運用手順書_顧客追加フロー.md`のconfig.txt E項と同じ方法）。

```bash
sudo sh -c "openssl rand -hex 32 > /etc/zabbix/zabbix_proxy.psk.new"
sudo chown zabbix:zabbix /etc/zabbix/zabbix_proxy.psk.new
sudo chmod 600 /etc/zabbix/zabbix_proxy.psk.new
echo "生成完了（内容は表示しない）"
```

新しい値を確認するため、この時点で一度だけ内容を表示してメモする（作業完了後は画面・履歴から消すこと）。

```bash
sudo cat /etc/zabbix/zabbix_proxy.psk.new
```

---

## 手順2: Zabbix Server側でPSK valueを更新する

1. `https://zabbix-admin.atlib.jp/`（Cloud IAP経由）にアクセスし、Zabbix管理画面にログインする
2. **Administration（管理） > Proxies（プロキシ）** を開き、対象のProxy名（例: `atlib-proxy-01`）をクリック
3. **Encryption**タブを開く
4. **PSK value**を、手順1で生成した新しい値に書き換える（**PSK identityは変更しない**、value（鍵の値）のみ更新する）
5. **Update**（更新）をクリックして保存する

> 保存した瞬間から、Zabbix ServerはこのProxyに対して新しいPSK valueでの認証を要求する。手順3でSensor Edge側を更新するまでの間、当該Proxyは「Unavailable」表示になる（想定内の一時的な状態）。

---

## 手順3: Sensor Edge側にPSKを反映する

**Sensor Edge上で**実行する。

```bash
# 既存ファイルを新しい値で置き換える
sudo mv /etc/zabbix/zabbix_proxy.psk.new /etc/zabbix/zabbix_proxy.psk
sudo chown zabbix:zabbix /etc/zabbix/zabbix_proxy.psk
sudo chmod 600 /etc/zabbix/zabbix_proxy.psk

# zabbix-proxyサービスを再起動して新しいPSKで再接続させる
sudo systemctl restart zabbix-proxy
sleep 3
sudo systemctl status zabbix-proxy --no-pager | head -10
```

---

## 手順4: 動作確認

Zabbix管理画面の **Administration > Proxies** 一覧で、該当Proxyのステータスが数分以内に「Available（使用可能）」に戻ることを確認する。

`Unavailable`のまま変化しない場合は手順5（トラブルシューティング）を参照。

---

## 手順5: トラブルシューティング

### `Unavailable`のまま戻らない

- 手順2のPSK identityを誤って変更していないか確認する（identityは変更不要、valueのみ）
- Sensor Edge側で`sudo journalctl -u zabbix-proxy -n 30 --no-pager`を確認し、`ZBX_TCP_READ() failed`や認証エラーが出ていないか確認する
- `/etc/zabbix/zabbix_proxy.psk`のパーミッション（`zabbix:zabbix`、600）が崩れていないか確認する

### ロールバック（変更前の状態に戻す）

手順1で生成した新しい値のみ破棄し、旧PSK valueに戻す。旧値を事前にメモしておらず破棄済みの場合、Zabbix Server側で新規に別のPSK valueを再生成し、手順2〜4を最初からやり直す（PSKには「以前の値に戻す」直接的な機能はないため、旧値をどこかに残していない限り実質的に「もう一度ローテーションする」形になる）。

---

## 手順6: 後片付け

- 新PSK valueをメモした場合は破棄する
- Sensor Edge側のコマンド履歴に新PSK valueが残っている場合、`history -c`でクリアする

---

## 変更履歴

- 2026-07-12: 初版作成。atladmin・DBパスワードのローテーション手順書と同じ構成で新設。Sensor Edgeへのリモートアクセス経路（tinyproxy折り返し）が現状LAN IP未把握のため確立していない課題を明記し、恒久対応（DHCP予約・台帳記録）を推奨事項として記載した。

<script type="text/plain" id="src-backup-dr">
最終更新: 2026-07-12
対象プロジェクト: `msp-zabbix`（GCP）

## 目的

本サービスが依存する永続データ（Zabbix ServerのDB、顧客ポータルのDB、各VMの状態）について、現状のバックアップ設定を棚卸しし、災害・誤操作・機器故障時の復旧方針を明文化する。

---

## 現状のバックアップ設定（2026-07-12時点、`gcloud`で確認済み）

### 1. `msp-customer-portal-db`（Cloud SQL, PostgreSQL）

顧客ポータルの顧客アカウント・ホストグループ対応・パスワードリセットトークン等を保持する。

- **自動バックアップ**: 有効
- **保持世代数**: 7世代
- **実行時刻**: 毎日 18:00
- **トランザクションログ保持**: 7日間（ポイントインタイムリカバリ＝PITR可能。障害発生の数分前など、任意の時点への復元ができる）

確認コマンド:
```bash
gcloud sql instances describe msp-customer-portal-db --format="yaml(settings.backupConfiguration)"
```

**評価**: Cloud SQLの標準機能により適切に設定済み。追加対応は不要（既定のまま）。

### 2. `zabbix-server`（GCE VM、自己管理PostgreSQL）

Zabbix Server本体のDB（監視データ・トリガー・ホスト設定等）は、Cloud SQLではなくVM上で自己管理されているPostgreSQLで運用されている（`運用手順書_zabbix-server_DBパスワードローテーション.md`参照）。

- **バックアップ方式**: VMディスクの自動スナップショット（`default-schedule-1`ポリシー）
- **実行時刻**: 毎日 17:00
- **保持期間**: 14日間
- **重要な制約**: `guestFlush: false`（**クラッシュコンシステント**なスナップショット。PostgreSQLのアプリケーションレベルの整合性は保証されない。リストア後はPostgreSQLの通常のクラッシュリカバリ（WALリプレイ）に委ねる形になり、理論上は最後のチェックポイント以降の直近データが失われる可能性がある）

確認コマンド:
```bash
gcloud compute disks describe zabbix-server --zone=asia-northeast1-a --format="yaml(resourcePolicies)"
gcloud compute resource-policies describe default-schedule-1 --region=asia-northeast1 --format="yaml(snapshotSchedulePolicy)"
```

**評価**: ディスクレベルのバックアップは存在するが、DB専用のバックアップ（`pg_dump`等）は別途無い。監視データという性質上、数分〜十数分程度のデータ欠損は許容範囲と考えられるが、**リストア手順自体は未検証**（下記「未実施事項」参照）。

### 3. `msp-frontend-server`（GCE VM）

月次報告書ツール（`atlib_monthly_report.html`他）、`api-bridge.php`、nginx設定等をホストする。`/opt/atlib-msp-dev`はgitリポジトリのsparse-checkoutのため、コード自体はGitHub側に本体がある（VM側の状態はいつでも`git clone`で再現可能）。VM固有の状態（nginx設定、Let's Encrypt証明書等）はリポジトリ管理外。

- **バックアップ方式**: VMディスクの自動スナップショット（`default-schedule-1`ポリシー、zabbix-serverと共通）
- **実行時刻・保持期間**: 上記2と同じ（毎日17:00、14日保持）

**評価**: コード資産はGitHubにあるため実質的な問題は小さいが、nginx設定・証明書等のVM固有設定はディスクスナップショットのみが復旧手段。

### 4. `msp-customer-portal`（Cloud Run）

コンテナイメージはソースからその都度ビルドされ、コード本体はGitHubにある（`gcloud run deploy --source=.`）ため、Cloud Run自体に「バックアップ」という概念は不要（再デプロイで復元可能）。環境変数・シークレット参照等の設定はサービス定義に含まれ、Cloud Run側で保持される。

**評価**: 追加対応不要。

---

## 死活監視（関連事項）

上記バックアップとは別に、`msp-customer-portal`および`topology.zabbix.atlib.jp`が実際にダウンしたことに気づく仕組みが無かったため、2026-07-12にGCP Cloud Monitoringの**Uptime Check**を新設した。

- 監視対象: `https://msp-customer-portal-135863453696.asia-northeast1.run.app/healthz/`、`https://topology.zabbix.atlib.jp/healthz`
- チェック間隔: 5分
- 通知先: メール通知チャネル「atLIB Ops Alert (Yoshihisa)」（`yoshihisa.hagisaka@atlib.jp`）
- アラートポリシー: `Portal and Topology Uptime Failure`（いずれかのチェックが失敗したら通知）

> **既知の誤検知（2026-07-11発生・解消済み）**: `msp-customer-portal`（Cloud Run）側で「Uptime Monitoring fired」のアラートが発報したが、実際にはアプリは正常稼働していた。原因はCloud Runのプラットフォーム層が、末尾スラッシュなしの完全一致パス`/healthz`へのGETリクエストをアプリに届く前に横取りし、独自の404を返す挙動（`/healthz/`とスラッシュを付ける、または他のパス名にすると発生しない）。`msp-customer-portal healthz`のUptime Check設定の`httpCheck.path`を`/healthz`→`/healthz/`に変更して解消した（`topology.zabbix.atlib.jp`側はnginx配信のため対象外・問題なし）。同種のアラートが再発した場合は、まずアプリ自体が生きているか（`/`や`/login.html`等の別パスで確認）を先に疑うこと。

確認コマンド:
```bash
gcloud monitoring uptime list-configs --format="table(displayName,name)"
```

Cloud Consoleでの確認: [Monitoring > Uptime checks](https://console.cloud.google.com/monitoring/uptime?project=msp-zabbix) / [Monitoring > Alerting](https://console.cloud.google.com/monitoring/alerting?project=msp-zabbix)

---

## 未実施事項・今後の推奨対応

- **実際のリストア訓練が未実施**：Cloud SQLの自動バックアップ・VMディスクスナップショットともに「設定は存在する」ことは確認したが、実際に復元して正常に起動するかは検証していない。特にzabbix-serverはクラッシュコンシステントなスナップショットのため、復元後にPostgreSQLが正常起動するかを一度確認しておくことを推奨する（別インスタンスへの復元テストなど、本番に影響しない方法で実施）。
- **zabbix-serverのDB専用バックアップの検討**：ディスクスナップショットに加えて、`pg_dump`による論理バックアップを定期取得しGCSに保管する等の追加対策を検討する余地がある（ディスク破損以外の要因、例えば誤ったDDL実行等からの復旧に有効）。
- **RTO/RPOの目標値が未設定**：「障害発生からどれくらいの時間で復旧すべきか（RTO）」「どれくらいのデータ欠損まで許容するか（RPO）」の具体的な目標値が事業判断として未確定。現状のバックアップ設定（日次・14日保持）が事業要件に対して十分かどうかは、この目標値が決まってから再評価するのが望ましい。

---

## 目的

Sensor Edge（顧客拠点設置のラズパイ）の資産情報（シリアル番号・封印シール番号等）・故障履歴・顧客からの問い合わせを一元管理する。バックエンドはGoogle Workspace（Sheets/Forms/Apps Script）とし、既存のGCPインフラとは独立して運用する。

対象範囲はSensor Edge本体の機器管理のみ。Zabbixが監視する顧客ネットワーク内の機器（ルーター・スイッチ等）はこのシステムの対象外（従来どおりZabbix/顧客ポータル側で管理する）。

## 背景

これまで機器のシリアル番号・封印シール番号・顧客対応情報は、`Sensor Edge/運用手順書_顧客追加フロー.md`に「台帳に記録する」と書かれているだけで、実体となるファイル・システムは存在しなかった（完全な手作業・記憶ベース）。故障履歴・問い合わせ管理の仕組みも存在しなかった。

**構築方法についての補足**: 当初Google Sheets/Forms/Apps ScriptをAPI経由で自動作成する方針を検討したが、`gcloud`の既定OAuthクライアントはこれらのAPIスコープを認可されておらず、プロジェクト専用のOAuthクライアントを新規作成しても対話的な認証フロー確立には至らなかった（2026-07-12に試行・断念）。そのため、**スプレッドシート・フォームの作成は手動、Apps Scriptのコードのみリポジトリで正本管理し手動貼り付けする**方式を採用した。

---

## データ構造

1つのスプレッドシート「Sensor Edge 機器管理台帳」に、4つの「マスタタブ」と、フォームごとに自動生成される「フォームの回答」タブを持たせる。

**設計方針（2026-07-12改訂）**: 各フォームで顧客情報を毎回手入力すると、表記ゆれ・入力ミスのリスクが高い。そのため「機器台帳」（シリアル番号キー）と「顧客マスタ」（顧客IDキー）の2つをマスタとし、フォームでは**キーを選ぶだけ**で他の項目（顧客名等）が自動補完される設計にしている。

### マスタタブ0: 顧客マスタ（新設）

| 列 | 内容 |
|---|---|
| 顧客ID | 主キー。`customer_code`（msp-customer-portalと共通の命名規則、DB連携はしない） |
| 顧客名 | |
| 連絡先メールアドレス | 任意 |
| 備考 | 任意 |

**入力方法**: 新規顧客のオンボーディング時に、担当エンジニアが直接このシートに1行追加する（`msp-customer-portal/docs/実施手順_顧客オンボーディング統合フロー.md`の該当手順を参照）。専用フォームは作らない。

### マスタタブ1: 機器台帳

| 列 | 内容 |
|---|---|
| シリアル番号 | 主キー |
| 封印シール番号 | |
| ホスト名 | 例: `atlib-proxy-02` |
| OSユーザー名 | |
| SSH公開鍵識別子 | |
| 顧客ID | フォームで顧客マスタから選択 |
| 顧客名 | フォーム送信時に顧客マスタから自動補完（手入力しない） |
| ステータス | 在庫 / 構築済み / 発送済み / 稼働中 / 返却済み / 廃棄 |
| LANIPアドレス | 分かれば記入（PSKローテーション作業で必要になる） |
| CHISEL_PORT | `customer_ledger.csv`と対応する値（手動で転記） |
| ZabbixProxyID | |
| PSKIdentity | |
| 作成日 | |
| 発送日 | |
| 返却日 | |
| 備考 | |

### マスタタブ2: 故障履歴

| 列 | 内容 |
|---|---|
| 記録ID | フォームが自動採番（例: `F-1752300000000`） |
| 対象シリアル番号 | フォームで機器台帳から選択 |
| 顧客ID | フォーム送信時に機器台帳から自動補完（手入力しない） |
| 発生日時 | |
| 症状内容 | |
| 原因 | 判明後に手動で追記 |
| 対応内容 | |
| 対応者 | |
| ステータス | 対応中 / 解決済み |
| 解決日時 | 解決後に手動で追記 |

### マスタタブ3: 問い合わせ管理

| 列 | 内容 |
|---|---|
| 問い合わせID | フォームが自動採番（例: `I-1752300000000`） |
| 受付日時 | |
| 会社名 | |
| 連絡先メールアドレス | |
| 件名 | |
| 内容 | |
| ステータス | 未対応 / 対応中 / 完了 |
| 対応者 | 対応開始時に手動で記入 |
| 対応内容 | |
| 完了日時 | |
| 関連シリアル番号 | 分かれば手動で記入 |

対応状況（ステータス・対応者・対応内容等）の更新は、マスタタブを直接手動編集する運用とする（更新用の別フォームは作らない）。

## 手順1: スプレッドシートを作成する

1. Google Driveで新規スプレッドシートを作成し、名前を「Sensor Edge 機器管理台帳」にする
2. デフォルトのシート名（シート1等）を「顧客マスタ」に変更する
3. 1行目に上記マスタタブ0のヘッダーを、列の順番どおりに入力する
4. 「機器台帳」「故障履歴」「問い合わせ管理」の3つのシートを追加し、それぞれ1行目に対応するヘッダーを入力する
5. 「顧客マスタ」タブに、既存顧客の`customer_code`・顧客名を今分かっている範囲で入力しておく（後から追加してもよい）
6. アドレスバーのURLから、スプレッドシートIDを控えておく（`https://docs.google.com/spreadsheets/d/`の後、`/edit`の前の文字列）。後の手順すべてで使用する

## 手順2: 「Sensor Edge機器登録フォーム」を作成する

1. Google Formsで新規フォームを作成し、名前を「Sensor Edge機器登録フォーム」にする
2. 以下の質問を、記載順のとおりに追加する

   | 質問 | 種類 | 必須 |
   |---|---|---|
   | シリアル番号 | 記述式 | ○ |
   | 封印シール番号 | 記述式 | ○ |
   | ホスト名 | 記述式 | ○ |
   | OSユーザー名 | 記述式 | |
   | SSH公開鍵識別子 | 記述式 | |
   | 顧客ID | **プルダウン**（選択肢は後の手順5.5で設定するため、この時点では仮に1つダミー値を入れておく） | ○ |
   | 発送日 | 日付 | ○ |
   | 備考 | 段落 | |

   **注意**: 「顧客名」の質問は作らない（Apps Scriptが顧客マスタから自動補完するため）。

3. 右上の「回答」タブを開き、緑のスプレッドシートアイコンをクリックし、「既存のスプレッドシートを選択」から手順1で作成した「Sensor Edge 機器管理台帳」を選ぶ（「機器登録フォームの回答」という新しいタブが自動生成される。これはマスタタブの「機器台帳」とは別物）
4. 右上の設定（歯車アイコン）で、回答者の制限は「組織内のみ」のままにしておく（社内向けフォームのため）
5. フォームのURLから、フォームIDを控えておく（`https://docs.google.com/forms/d/`の後、`/edit`の前の文字列）。手順5.5で使用する

## 手順3: 「故障報告フォーム」を作成する

1. 同様に新規フォームを作成し、名前を「故障報告フォーム」にする
2. 以下の質問を追加する

   | 質問 | 種類 | 必須 |
   |---|---|---|
   | 対象シリアル番号 | **プルダウン**（選択肢は後の手順5.5で設定するため、この時点では仮に1つダミー値を入れておく） | ○ |
   | 発生日時 | 日付 | ○ |
   | 症状・内容 | 段落 | ○ |
   | 対応内容（現時点で分かれば） | 段落 | |
   | 対応者 | 記述式 | ○ |

   **注意**: 「顧客ID」の質問は作らない（Apps Scriptが機器台帳から自動補完するため）。

3. 手順2と同様に、回答先を同じ「Sensor Edge 機器管理台帳」スプレッドシートに設定する
4. 回答者の制限は「組織内のみ」のままにしておく
5. フォームのURLから、フォームIDを控えておく。手順5.5で使用する

## 手順4: 「お問い合わせフォーム」を作成する（顧客向け・公開）

1. 同様に新規フォームを作成し、名前を「お問い合わせフォーム」にする
2. 以下の質問を追加する

   | 質問 | 種類 | 必須 |
   |---|---|---|
   | 会社名 | 記述式 | ○ |
   | 連絡先メールアドレス | 記述式（メールアドレスの回答検証を有効にする） | ○ |
   | 件名 | 記述式 | ○ |
   | 内容 | 段落 | ○ |

3. 手順2と同様に、回答先を同じ「Sensor Edge 機器管理台帳」スプレッドシートに設定する
4. **重要**: 右上の設定（歯車アイコン）で、回答者の制限を「組織内のみ」から**外す**（顧客が社外からアクセスするため）。「メールアドレスを収集する」は無効のままでよい（フォーム内の「連絡先メールアドレス」の質問で別途取得している）
5. フォームを送信し、右上の「送信」ボタンからリンクを取得しておく（顧客への案内・ポータルへの掲載に使用）

## 手順5: 各フォームにApps Scriptを設定する

`Sensor Edge/tools/device-management/`配下の3つの`.gs`ファイルを、対応するフォームに設定する。3フォームとも同じ手順を繰り返す。

1. 対象のフォームを開き、右上の「⋮」（その他）メニューから「アドオンとスクリプト」または「スクリプト エディタ」を開く（フォーム自体に紐付くApps Scriptプロジェクトが新規作成される）
2. 対応する`.gs`ファイルの中身を全てコピーし、エディタにそのまま貼り付ける
3. `MASTER_SHEET_ID = "PASTE_SPREADSHEET_ID_HERE"`の`PASTE_SPREADSHEET_ID_HERE`部分を、手順1で控えたスプレッドシートIDに書き換える
4. フロッピーアイコン（保存）をクリックして保存する
5. 左側の時計アイコン（トリガー）を開き、右下の「トリガーを追加」をクリックする
6. 「実行する関数を選択」で`onFormSubmit`、「イベントの種類を選択」で「フォーム送信時」を選び、保存する
7. 初回のみ権限の確認画面が表示される。自分のGoogleアカウントを選び、「詳細」→「（プロジェクト名）に移動」→「許可」と進んで承認する

対応表（再掲）:

| フォーム | 貼り付けるファイル |
|---|---|
| Sensor Edge機器登録フォーム | `form1-device-registration.gs` |
| 故障報告フォーム | `form2-failure-report.gs` |
| お問い合わせフォーム | `form3-inquiry.gs` |

## 手順5.5: プルダウン同期スクリプトを設定する

機器登録フォームの「顧客ID」・故障報告フォームの「対象シリアル番号」の選択肢を、マスタタブの内容と同期させる仕組みを設定する。今度はフォームではなく**スプレッドシート本体**に紐付ける。

1. スプレッドシート「Sensor Edge 機器管理台帳」を開き、上部メニューの「拡張機能」>「Apps Script」を開く
2. `Sensor Edge/tools/device-management/sync-dropdowns.gs`の中身を全てコピーし、エディタに貼り付ける
3. 冒頭の3つの定数を書き換える
   - `MASTER_SHEET_ID`: 手順1で控えたスプレッドシートID
   - `FORM1_ID`: 手順2で控えた機器登録フォームのID
   - `FORM2_ID`: 手順3で控えた故障報告フォームのID
4. フロッピーアイコンで保存する
5. 関数選択のプルダウンで`syncAllDropdowns`を選び、実行ボタン（▷）を押して1回手動実行する（初回は権限確認画面が出るので承認する）
6. 実行後、機器登録フォーム・故障報告フォームを開き、プルダウンの選択肢が手順1-5で入力した顧客マスタ・機器台帳の内容に置き換わっていることを確認する
7. 左側の時計アイコン（トリガー）を開き、「トリガーを追加」をクリックする
8. 「実行する関数を選択」で`syncAllDropdowns`、「イベントのソースを選択」で「時間主導型」、「時間ベースのトリガーのタイプを選択」で「日タイマー」を選び、任意の時間帯（例: 午前1時〜2時）を指定して保存する（これで毎日1回、自動的にプルダウンが最新化される）
9. スプレッドシートを一度リロードすると、メニューバーに「機器管理システム」というメニューが追加される。「プルダウンを今すぐ同期」からいつでも手動同期できる（新しい顧客・機器を登録した直後にすぐ使いたい場合はこちらを使う）

## 手順6: 動作確認

1. 「機器管理システム」メニューから「プルダウンを今すぐ同期」を実行する
2. 各フォームにテスト送信を行う（機器登録フォームの「顧客ID」・故障報告フォームの「対象シリアル番号」はプルダウンから選ぶ）
3. スプレッドシートの対応するマスタタブ（機器台帳／故障履歴／問い合わせ管理）に、新しい行が正しい列に整形されて追加されることを確認する。特に、機器台帳の「顧客名」・故障履歴の「顧客ID」が手入力なしで自動的に埋まっていることを確認する
4. 故障報告フォーム・お問い合わせフォームについては、`yoshihisa.hagisaka@atlib.jp`に通知メールが届くことを確認する
5. テスト送信で追加された行は、確認後に削除しておく（本番データと混在させない）

## 手順7: 共有設定

1. スプレッドシートの「共有」から、Googleグループ`msp-staff@atlib.jp`を「編集者」として追加する（既存のIAPアクセス制御と同じグループを使い、権限管理を一本化する）
2. Sensor Edge機器登録フォーム・故障報告フォームは、組織内限定のままでよい（手順2・3の設定どおり）
3. お問い合わせフォームのリンクを、顧客向けの案内文書・`msp-customer-portal`のトップページ等に掲載することを検討する（本手順書の範囲外。掲載する場合は別途対応）

## 保守・注意事項

- **Apps Scriptの正本はリポジトリ側**（`Sensor Edge/tools/device-management/`）。GWS側でコードを修正した場合は、リポジトリ側のファイルにも同じ内容を反映してコミットすること
- フォームの質問文言を変更した場合、Apps Script側の`get("質問文言")`・`setDropdownChoices`の質問文言指定も完全一致させないと転記・同期が失敗する（サイレントに空欄になる、またはエラーになる）
- スプレッドシートのマスタタブの列を追加・削除・並び替えした場合、対応する`.gs`ファイルの`appendRow`の配列順・`lookupCustomerBySerial`等の列インデックスも必ず合わせて修正すること
- 顧客マスタ・機器台帳に新しい顧客・機器を追加した直後にすぐフォームで使いたい場合は、スプレッドシートのメニュー「機器管理システム」>「プルダウンを今すぐ同期」を実行する（自動同期は1日1回のため、それまでは新しい選択肢がプルダウンに出てこない）
- `customer_ledger.csv`（zabbix.atlib.jp上、Chiselリレー認証用）とは別物であり、本システムはそれを置き換えない

## 変更履歴

- 2026-07-12: 初版作成。Sensor Edge機器の資産管理・故障履歴管理・問い合わせ管理をGWS上に構築。API経由の自動作成はOAuthスコープ制限により断念し、手動セットアップ＋Apps Scriptコードのリポジトリ管理方式を採用。
- 2026-07-12（同日改訂）: 各フォームでの顧客情報の重複入力・表記ゆれを防ぐため、マスタ参照方式に再設計。「顧客マスタ」タブを新設し、機器登録フォームの「顧客ID」・故障報告フォームの「対象シリアル番号」をプルダウン化。Apps Scriptが選択されたキーから顧客名・顧客ID等を自動補完するようにした。プルダウンの選択肢を同期する`sync-dropdowns.gs`（毎日自動同期＋メニューからの手動同期）を新設。
