    "実施手順_バックアップDR方針.md": "guide-backup-dr",
    "運用手順書_機器管理システム.md": "device-mgmt",
    "実施手順_機器管理システム.md": "guide-device-mgmt"
  };

  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // ---- inline markdown: code spans, bold, links (incl. xref: scheme) ----
  function inline(text, headings) {
    var out = esc(text);

    // links: [label](url)
    out = out.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (m, label, url) {
      if (url.indexOf("xref:") === 0) {
        var rest = url.slice(5);
        var hashIdx = rest.indexOf("#");
        var slug = hashIdx >= 0 ? rest.slice(0, hashIdx) : rest;
        var headingText = hashIdx >= 0 ? decodeURIComponent(rest.slice(hashIdx + 1)) : null;
        return xrefAnchor(slug, headingText, label, headings);
      }
      // relative .md path: try to resolve to a known doc by basename
      var base = url.split("/").pop();
      if (FILENAME_TO_SLUG[base]) {
        return xrefAnchor(FILENAME_TO_SLUG[base], null, label, headings);
      }
      if (/^https?:\/\//.test(url)) {
        return '<a href="' + url + '" target="_blank" rel="noopener">' + label + "</a>";
      }
      // unresolvable relative link (e.g. msp_frontend_design.md, not included) -> inert text
      return '<span class="xref-missing" title="このページには含まれていません">' + label + "</span>";
    });

    // bare filename mentions not already inside a link/code -> auto xref (best effort)
    Object.keys(FILENAME_TO_SLUG).forEach(function (fname) {
      var slug = FILENAME_TO_SLUG[fname];
      var re = new RegExp(fname.replace(/[.]/g, "\\."), "g");
      out = out.replace(re, function (m, offset, str) {
        var before = str.slice(0, offset);
        var openA = before.lastIndexOf("<a");
        var closeA = before.lastIndexOf("</a>");
        if (openA > closeA) return m; // already inside a link
        return xrefAnchor(slug, null, m, headings);
      });
    });

    out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
    out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    return out;
  }

  function xrefAnchor(slug, headingText, label, headings) {
    var id = "doc-" + slug;
    if (headingText && headings[slug] && headings[slug][headingText]) {
      id = headings[slug][headingText];
    }
    return '<a class="xref" href="#' + id + '" data-xref="1">' + label + "</a>";
  }

  // ---- block-level markdown parser ----
  function parseDoc(raw, slug, headings) {
    var lines = raw.replace(/\r\n/g, "\n").split("\n");
    var html = [];
    var i = 0;
    headings[slug] = headings[slug] || {};
    var hCounter = 0;

    function slugId() { hCounter++; return "doc-" + slug + "-h" + hCounter; }

    while (i < lines.length) {
      var line = lines[i];

      if (/^\s*$/.test(line)) { i++; continue; }

      // fenced code block
      var fence = line.match(/^```(\S*)\s*$/);
      if (fence) {
        var lang = fence[1] || "";
        var buf = [];
        i++;
        while (i < lines.length && !/^```\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++; // skip closing fence
        html.push('<pre>' + (lang ? '<span class="lang">' + esc(lang) + "</span>" : "") +
          "<code>" + esc(buf.join("\n")) + "</code></pre>");
        continue;
      }

      // heading
      var h = line.match(/^(#{1,5})\s+(.*)$/);
      if (h) {
        var level = h[1].length;
        var text = h[2].trim();
        var tag = level === 1 ? "h3" : level === 2 ? "h3" : level === 3 ? "h4" : "h5";
        var id = slugId();
        headings[slug][text] = id;
        html.push("<" + tag + ' id="' + id + '">' + inline(text, headings) + "</" + tag + ">");
        i++;
        continue;
      }

      // horizontal rule
      if (/^-{3,}\s*$/.test(line)) { html.push("<hr>"); i++; continue; }

      // table
      if (/^\|/.test(line) && i + 1 < lines.length && /^\|?\s*:?-{2,}/.test(lines[i + 1])) {
        var headerCells = line.replace(/^\||\|$/g, "").split("|").map(function (c) { return c.trim(); });
        i += 2;
        var rows = [];
        while (i < lines.length && /^\|/.test(lines[i])) {
          rows.push(lines[i].replace(/^\||\|$/g, "").split("|").map(function (c) { return c.trim(); }));
          i++;
        }
        var t = ['<div class="table-wrap"><table><thead><tr>'];
        headerCells.forEach(function (c) { t.push("<th>" + inline(c, headings) + "</th>"); });
        t.push("</tr></thead><tbody>");
        rows.forEach(function (r) {
          t.push("<tr>");
          r.forEach(function (c) { t.push("<td>" + inline(c, headings) + "</td>"); });
          t.push("</tr>");
        });
        t.push("</tbody></table></div>");
        html.push(t.join(""));
        continue;
      }

      // blockquote
      if (/^>\s?/.test(line)) {
        var qbuf = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) {
          qbuf.push(lines[i].replace(/^>\s?/, ""));
          i++;
        }
        html.push("<blockquote>" + renderParagraphish(qbuf, headings) + "</blockquote>");
        continue;
      }

      // numbered list
      if (/^\s*\d+\.\s+/.test(line)) {
        var olItems = [];
        while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
          var itemLines = [lines[i].replace(/^\s*\d+\.\s+/, "")];
          i++;
          while (i < lines.length && /^\s{3,}\S/.test(lines[i]) && !/^\s*[-\d]/.test(lines[i].trim())) {
            itemLines.push(lines[i].trim());
            i++;
          }
          // nested bullet list under a numbered item
          var nested = "";
          if (i < lines.length && /^\s{3,}-\s+/.test(lines[i])) {
            var nb = [];
            while (i < lines.length && /^\s{3,}-\s+/.test(lines[i])) {
              nb.push(lines[i].replace(/^\s{3,}-\s+/, ""));
              i++;
            }
            nested = "<ul>" + nb.map(function (b) { return "<li>" + inline(b, headings) + "</li>"; }).join("") + "</ul>";
          }
          olItems.push("<li>" + inline(itemLines.join(" "), headings) + nested + "</li>");
        }
        html.push("<ol>" + olItems.join("") + "</ol>");
        continue;
      }

      // bullet list
      if (/^\s*-\s+/.test(line)) {
        var ulItems = [];
        while (i < lines.length && /^\s*-\s+/.test(lines[i])) {
          var uiLines = [lines[i].replace(/^\s*-\s+/, "")];
          i++;
          while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*-\s+/.test(lines[i])) {
            uiLines.push(lines[i].trim());
            i++;
          }
          var nested2 = "";
          if (i < lines.length && /^\s{2,}-\s+/.test(lines[i])) {
            var nb2 = [];
            while (i < lines.length && /^\s{2,}-\s+/.test(lines[i])) {
              nb2.push(lines[i].replace(/^\s{2,}-\s+/, ""));
              i++;
            }
            nested2 = "<ul>" + nb2.map(function (b) { return "<li>" + inline(b, headings) + "</li>"; }).join("") + "</ul>";
          }
          ulItems.push("<li>" + inline(uiLines.join(" "), headings) + nested2 + "</li>");
        }
        html.push("<ul>" + ulItems.join("") + "</ul>");
        continue;
      }

      // paragraph (accumulate until blank line)
      var pbuf = [];
      while (i < lines.length && !/^\s*$/.test(lines[i]) &&
             !/^#{1,5}\s/.test(lines[i]) && !/^```/.test(lines[i]) &&
             !/^-{3,}\s*$/.test(lines[i]) && !/^\|/.test(lines[i]) &&
             !/^>\s?/.test(lines[i]) && !/^\s*-\s+/.test(lines[i]) && !/^\s*\d+\.\s+/.test(lines[i])) {
        pbuf.push(lines[i]);
        i++;
      }
      html.push("<p>" + inline(pbuf.join(" "), headings) + "</p>");
    }
    return html.join("\n");
  }

  function renderParagraphish(lines, headings) {
    return lines.filter(function (l) { return l.trim() !== ""; })
      .map(function (l) { return "<p>" + inline(l, headings) + "</p>"; }).join("");
  }

  // ---- boot ----
  var headings = {};
  var rendered = {};
  DOCS.forEach(function (d) {
    var raw = document.getElementById("src-" + d.slug).textContent;
    rendered[d.slug] = parseDoc(raw, d.slug, headings);
  });

  var nav = document.getElementById("navlist");
  var main = document.getElementById("main");
  var lastGroup = null;

  DOCS.forEach(function (d) {
    if (d.group !== lastGroup) {
      var label = document.createElement("li");
      label.className = "nav-group-label";
      label.textContent = GROUP_LABEL[d.group];
      nav.appendChild(label);
      lastGroup = d.group;
    }

    var li = document.createElement("li");
    var a = document.createElement("a");
    a.href = "#doc-" + d.slug;
    a.innerHTML = '<span class="tag">' + d.tag + "</span><span>" + d.title + "</span>";
    a.dataset.slug = d.slug;
    li.appendChild(a);
    nav.appendChild(li);

    var section = document.createElement("section");
    section.className = "doc";
    section.id = "doc-" + d.slug;
    var eyebrow = (d.group === "guide" ? "操作ガイド " : "運用仕様書 ") + d.tag;
    section.innerHTML =
      '<header class="doc-head"><span class="eyebrow">' + eyebrow + "</span><h2>" + d.title + "</h2></header>" +
      rendered[d.slug];
    main.appendChild(section);
  });

  // smooth scroll for in-page anchors (xref + nav)
  document.addEventListener("click", function (e) {
    var a = e.target.closest('a[href^="#"]');
    if (!a) return;
    var id = a.getAttribute("href").slice(1);
    var target = document.getElementById(id);
    if (!target) return;
    e.preventDefault();
    target.scrollIntoView({ behavior: "smooth", block: "start" });
    history.replaceState(null, "", "#" + id);
  });

  // active section highlighting
  var navLinks = Array.prototype.slice.call(nav.querySelectorAll("a"));
  var sections = DOCS.map(function (d) { return document.getElementById("doc-" + d.slug); });
  function setActive(slug) {
    navLinks.forEach(function (a) { a.classList.toggle("active", a.dataset.slug === slug); });
  }
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) setActive(entry.target.id.replace("doc-", ""));
    });
  }, { rootMargin: "-10% 0px -70% 0px", threshold: 0 });
  sections.forEach(function (s) { io.observe(s); });
  setActive(DOCS[0].slug);

  // theme toggle
  var root = document.documentElement;
  var btn = document.getElementById("themeToggle");
  var icon = document.getElementById("themeIcon");
  var label = document.getElementById("themeLabel");
  function applyTheme(t) {
    if (t) { root.setAttribute("data-theme", t); } else { root.removeAttribute("data-theme"); }
    var isDark = t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches);
    icon.textContent = isDark ? "☀" : "☾";
    label.textContent = isDark ? "ライトに切替" : "ダークに切替";
  }
  var saved = null;
  try { saved = localStorage.getItem("ops-theme"); } catch (e) {}
  applyTheme(saved);
  btn.addEventListener("click", function () {
    var current = root.getAttribute("data-theme") ||
      (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    var next = current === "dark" ? "light" : "dark";
    applyTheme(next);
    try { localStorage.setItem("ops-theme", next); } catch (e) {}
  });
})();
</script>

</body>
